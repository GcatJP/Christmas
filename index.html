<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Christmas Island</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b2f3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Christmas" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="images/Cicon.jpg" />
    <link rel="icon" type="image/png" href="images/Cicon.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Mountains+of+Christmas:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg1: #07222b;
        --bg2: #0e4150;
        --bg3: #1b6b6f;
        --red: #d7263d;
        --gold: #ffcf4a;
        --snow: #ffffff;
        --cream: #fffaf0;
        --font:
          "Fredoka", "Chalkboard SE", "Hiragino Maru Gothic ProN",
          "Comic Sans MS", system-ui, sans-serif;
        --title:
          "Mountains of Christmas", "Fredoka", "Hiragino Maru Gothic ProN",
          cursive, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg1);
        font-family: var(--font);
        color: var(--cream);
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      body {
        background:
          radial-gradient(
            ellipse at 15% 0%,
            rgba(80, 220, 160, 0.28),
            transparent 45%
          ),
          radial-gradient(
            ellipse at 90% 10%,
            rgba(215, 38, 61, 0.22),
            transparent 40%
          ),
          linear-gradient(
            180deg,
            var(--bg1) 0%,
            var(--bg2) 60%,
            var(--bg3) 100%
          );
      }

      /* ---------- decorations ---------- */
      #lights {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(env(safe-area-inset-top, 0px) + 34px);
        z-index: 3;
        pointer-events: none;
      }
      .bulb {
        position: absolute;
        width: 12px;
        height: 18px;
        border-radius: 50% 50% 55% 55%;
        background: var(--c);
        box-shadow: 0 0 12px 4px var(--c);
        animation: glow 1.8s infinite ease-in-out;
      }
      .bulb::before {
        content: "";
        position: absolute;
        left: 3px;
        top: -5px;
        width: 6px;
        height: 6px;
        background: #2b3a3f;
        border-radius: 2px;
      }
      @keyframes glow {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }
      .flake {
        position: fixed;
        top: -10px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.85;
        z-index: 0;
        pointer-events: none;
        animation: fall linear infinite;
      }
      @keyframes fall {
        from {
          transform: translate(0, -5vh);
        }
        to {
          transform: translate(var(--dx), 108vh);
        }
      }
      .hill {
        position: fixed;
        left: -10vw;
        right: -10vw;
        z-index: 0;
        border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        pointer-events: none;
      }
      .hill.h1 {
        bottom: -6vh;
        height: 16vh;
        background: linear-gradient(180deg, #f4fbff, #cfe6f2);
      }
      .hill.h2 {
        bottom: -9vh;
        height: 15vh;
        left: 20vw;
        right: -30vw;
        background: linear-gradient(180deg, #e3f2fa, #b9d8e8);
      }

      /* ---------- main screen ---------- */
      #app {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 30px)
          calc(env(safe-area-inset-right, 0px) + 14px)
          calc(env(safe-area-inset-bottom, 0px) + 12px)
          calc(env(safe-area-inset-left, 0px) + 14px);
        gap: 3vmin;
      }
      header {
        text-align: center;
      }
      h1 {
        font-family: var(--title);
        font-size: clamp(36px, 9.5vmin, 86px);
        line-height: 1;
        color: var(--snow);
        font-weight: 700;
        letter-spacing: 0.01em;
        text-shadow:
          0 4px 0 var(--red),
          0 0 26px rgba(255, 207, 74, 0.55);
      }
      .sub {
        display: inline-block;
        margin-top: 1.4vmin;
        padding: 0.1em 0.9em;
        font-size: clamp(15px, 3.2vmin, 28px);
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #5a1a00;
        background: var(--gold);
        border-radius: 40px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
      }

      .menu {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: clamp(10px, 2.6vmin, 26px);
        width: min(92vw, 640px, calc((100vh - 230px) / 1.5));
      }

      /* each button is a wrapped present */
      .card {
        --c1: #ff5a6e;
        --c2: #b81830;
        --rib: var(--gold);
        --ink: #8c1226;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 0.8vmin;
        text-decoration: none;
        color: #fff;
        border-radius: clamp(12px, 2.6vmin, 22px);
        padding: clamp(8px, 1.8vmin, 18px);
        padding-top: clamp(14px, 3.4vmin, 30px);
        aspect-ratio: 1/1;
        position: relative;
        overflow: visible;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.26) 0 17%,
            rgba(0, 0, 0, 0.18) 17% 18.5%,
            transparent 18.5%
          ),
          linear-gradient(160deg, var(--c1), var(--c2));
        box-shadow:
          0 8px 0 rgba(0, 0, 0, 0.38),
          0 14px 26px rgba(0, 0, 0, 0.4),
          inset 0 0 0 3px rgba(255, 255, 255, 0.28);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .card:active {
        transform: translateY(6px);
        box-shadow:
          0 2px 0 rgba(0, 0, 0, 0.38),
          0 6px 12px rgba(0, 0, 0, 0.4),
          inset 0 0 0 3px rgba(255, 255, 255, 0.28);
      }
      /* vertical ribbon */
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 15%;
        transform: translateX(-50%);
        background:
          linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.12),
            rgba(255, 255, 255, 0.35) 50%,
            rgba(0, 0, 0, 0.12)
          ),
          var(--rib);
        border-radius: 2px;
        z-index: 0;
      }
      /* bow */
      .card::after {
        content: "🎀";
        position: absolute;
        top: calc(-1 * clamp(10px, 2.6vmin, 22px));
        left: 50%;
        transform: translateX(-50%);
        font-size: clamp(24px, 6vmin, 48px);
        line-height: 1;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35));
        z-index: 3;
      }
      .card img,
      .card .emo {
        position: relative;
        z-index: 1;
        width: 62%;
        height: auto;
        max-height: 58%;
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.4));
        animation: bob 3s ease-in-out infinite;
      }
      .card .emo {
        width: auto;
        font-size: clamp(44px, 13vmin, 96px);
        line-height: 1;
      }
      .card:nth-child(2) img,
      .card:nth-child(2) .emo {
        animation-delay: -0.7s;
      }
      .card:nth-child(3) img,
      .card:nth-child(3) .emo {
        animation-delay: -1.4s;
      }
      .card:nth-child(4) img,
      .card:nth-child(4) .emo {
        animation-delay: -2.1s;
      }
      .card:nth-child(5) img,
      .card:nth-child(5) .emo {
        animation-delay: -2.8s;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      /* gift-tag label */
      .card .lbl {
        position: relative;
        z-index: 2;
        font-size: clamp(16px, 3.8vmin, 30px);
        font-weight: 700;
        color: var(--ink);
        background: var(--cream);
        padding: 0.12em 0.8em;
        border-radius: 40px;
        text-align: center;
        line-height: 1.15;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      }

      .c-study {
        --c1: #ff5a6e;
        --c2: #b81830;
        --rib: #ffcf4a;
        --ink: #a0132a;
      }
      .c-match {
        --c1: #38c172;
        --c2: #14753a;
        --rib: #ffe9a0;
        --ink: #0f5e2f;
      }
      .c-type {
        --c1: #5bc0f8;
        --c2: #1b73c4;
        --rib: #ffffff;
        --ink: #14589a;
      }
      .c-word {
        --c1: #ffc83d;
        --c2: #e08a00;
        --rib: #d7263d;
        --ink: #8a4a00;
      }
      .c-sheet {
        --c1: #b57bff;
        --c2: #6b32c9;
        --rib: #ffcf4a;
        --ink: #4f2095;
      }
      .c-build {
        --c1: #ff8fb1;
        --c2: #d6336c;
        --rib: #ffffff;
        --ink: #a01f4f;
      }
      /* portrait: 2 + 2 + 1 (last present sits in the middle) */
      .card:nth-child(5):last-child {
        grid-column: 1 / -1;
        justify-self: center;
        width: calc(50% - clamp(5px, 1.3vmin, 13px));
      }

      @media (orientation: landscape) {
        #app {
          gap: 2vmin;
        }
        .menu {
          grid-template-columns: repeat(6, minmax(0, 1fr));
          width: min(96vw, 1200px);
        }
        .card {
          aspect-ratio: auto;
          height: min(44vh, 290px);
        }
        .card:nth-child(5):last-child {
          grid-column: auto;
          justify-self: stretch;
          width: auto;
        }
        .card img {
          max-height: 56%;
          width: auto;
          max-width: 78%;
        }
        h1 {
          font-size: clamp(30px, 11vh, 76px);
        }
        .sub {
          font-size: clamp(13px, 3.8vh, 26px);
        }
        .card .lbl {
          font-size: clamp(14px, 4.4vh, 28px);
        }
      }
      @media (orientation: portrait) and (min-width: 700px) {
        .menu {
          width: min(86vw, 760px, calc((100vh - 230px) / 1.5));
        }
      }

      .credit {
        font-size: clamp(12px, 2.4vmin, 20px);
        color: var(--gold);
        background: rgba(7, 34, 43, 0.72);
        padding: 0.15em 0.9em;
        border-radius: 30px;
        letter-spacing: 0.04em;
        text-align: center;
      }

      /* ---------- mute button ---------- */
      #mute {
        position: fixed;
        z-index: 30;
        top: calc(env(safe-area-inset-top, 0px) + 36px);
        right: calc(env(safe-area-inset-right, 0px) + 12px);
        width: clamp(46px, 8vmin, 66px);
        height: clamp(46px, 8vmin, 66px);
        border-radius: 50%;
        border: 3px solid #fff;
        background: var(--red);
        font-size: clamp(22px, 4.2vmin, 34px);
        cursor: pointer;
        color: #fff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #mute:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      #mute.off {
        background: #5d7078;
      }

      /* ---------- loading screen ---------- */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5vmin;
        background:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(80, 220, 160, 0.3),
            transparent 50%
          ),
          linear-gradient(180deg, var(--bg1), var(--bg2) 60%, var(--bg3));
        transition: opacity 0.6s;
        padding: 20px;
        text-align: center;
      }
      #loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      .chars {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 4vmin;
      }
      .chars img,
      .chars .emo {
        height: clamp(120px, 32vmin, 300px);
        width: auto;
        max-width: 42vw;
        object-fit: contain;
        filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.45));
        animation: bob 2.2s ease-in-out infinite;
      }
      .chars .emo {
        height: auto;
        font-size: clamp(80px, 24vmin, 200px);
        line-height: 1;
      }
      .chars img + img,
      .chars .emo + .emo,
      .chars img + .emo,
      .chars .emo + img {
        animation-delay: -1.1s;
      }
      #loader h2 {
        font-family: var(--title);
        font-size: clamp(30px, 7vmin, 58px);
        color: #fff;
        text-shadow: 0 3px 0 var(--red);
      }
      .bar {
        width: min(70vw, 420px);
        height: clamp(16px, 2.8vmin, 24px);
        border-radius: 20px;
        background: repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.25) 0 10px,
          rgba(255, 255, 255, 0.1) 10px 20px
        );
        border: 3px solid #fff;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: repeating-linear-gradient(
          -45deg,
          var(--red) 0 10px,
          #fff 10px 20px
        );
        transition: width 0.3s;
      }
      #startBtn {
        display: none;
        font-family: var(--font);
        font-weight: 700;
        font-size: clamp(22px, 5vmin, 40px);
        padding: 0.45em 1.5em;
        border-radius: 60px;
        border: 4px solid #fff;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(160deg, #38c172, #14753a);
        box-shadow: 0 7px 0 rgba(0, 0, 0, 0.35);
        animation: pulse 1.4s ease-in-out infinite;
      }
      #startBtn:active {
        transform: translateY(5px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.07);
        }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        #loader {
          gap: 1.5vh;
        }
        .chars img {
          height: 30vh;
        }
        .chars .emo {
          font-size: 24vh;
        }
      }
    </style>
  </head>
  <body>
    <div id="lights"></div>
    <div id="sky"></div>
    <div class="hill h1"></div>
    <div class="hill h2"></div>

    <button id="mute" aria-label="Mute music" title="Music on/off">🔊</button>

    <main id="app">
      <header>
        <h1>Christmas Island</h1>
        <div class="sub">Games &amp; Study</div>
      </header>
      <nav class="menu">
        <a class="card c-study" href="study.html"
          ><img src="images/santa.png" data-emo="🎅" alt="" /><span class="lbl"
            >Study</span
          ></a
        >
        <a class="card c-match" href="matchup.html"
          ><img src="images/reindeer.png" data-emo="🦌" alt="" /><span
            class="lbl"
            >Match up</span
          ></a
        >
        <a class="card c-type" href="typeup.html"
          ><img src="images/snowman.png" data-emo="⛄" alt="" /><span
            class="lbl"
            >Type up</span
          ></a
        >
        <a class="card c-word" href="wordup.html"
          ><img src="images/tree.png" data-emo="🎄" alt="" /><span class="lbl"
            >Word up</span
          ></a
        >
        <a class="card c-build" href="sentencebuilder.html"
          ><img src="images/elf.png" data-emo="🧝" alt="" /><span class="lbl"
            >Sentence Builder</span
          ></a
        >
        <a class="card c-sheet" href="worksheets.html"
          ><img src="images/present.png" data-emo="🎁" alt="" /><span
            class="lbl"
            >Worksheets</span
          ></a
        >
      </nav>
      <div class="credit">Created by Graeme Cattermole</div>
    </main>

    <div id="loader">
      <div class="chars">
        <img src="images/santa.png" data-emo="🎅" alt="Santa" />
        <img src="images/snowman.png" data-emo="⛄" alt="Snowman" />
      </div>
      <h2>Loading...</h2>
      <div class="bar"><i id="barFill"></i></div>
      <button id="startBtn">Tap to Start!</button>
      <div class="credit">Created by Graeme Cattermole</div>
    </div>

    <script>
      /* ===== settings ===== */
      var MUSIC_VOLUME = 0.1; // background level (0 to 1). Lower = quieter
      var TEMPO_BPM = 132;
      var MIN_LOAD_MS = 1500; // shortest time the loading screen shows

      /* ===== twinkling string lights ===== */
      var LIGHT_COLORS = [
        "#ff4d5e",
        "#ffd54a",
        "#4ade80",
        "#5bc0f8",
        "#ff9ad5",
      ];
      function buildLights() {
        var box = document.getElementById("lights");
        box.innerHTML = "";
        var inset = parseFloat(getComputedStyle(box).height) - 34 || 0;
        var gap = 34;
        var n = Math.ceil(window.innerWidth / gap) + 1;
        for (var i = 0; i < n; i++) {
          var b = document.createElement("div");
          b.className = "bulb";
          var sag = Math.sin((Math.PI * (i % 6)) / 6) * 10;
          b.style.left = i * gap + 4 + "px";
          b.style.top = inset + 6 + sag + "px";
          b.style.setProperty("--c", LIGHT_COLORS[i % LIGHT_COLORS.length]);
          b.style.animationDelay = -((i * 0.37) % 1.8) + "s";
          box.appendChild(b);
        }
      }
      buildLights();
      window.addEventListener("resize", buildLights);

      /* ===== snowfall ===== */
      (function () {
        var sky = document.getElementById("sky");
        for (var i = 0; i < 46; i++) {
          var f = document.createElement("div");
          f.className = "flake";
          var s = 3 + Math.random() * 6;
          f.style.width = s + "px";
          f.style.height = s + "px";
          f.style.left = Math.random() * 100 + "vw";
          f.style.opacity = 0.45 + Math.random() * 0.5;
          f.style.animationDuration = 8 + Math.random() * 9 + "s";
          f.style.animationDelay = -Math.random() * 16 + "s";
          f.style.setProperty("--dx", Math.random() * 16 - 8 + "vw");
          sky.appendChild(f);
        }
      })();

      /* ===== picture fallbacks (shows an emoji if a png is missing) ===== */
      function swapToEmoji(im) {
        if (!im.parentNode) return;
        var e = document.createElement("span");
        e.className = "emo";
        e.textContent = im.getAttribute("data-emo") || "🎄";
        im.parentNode.replaceChild(e, im);
      }
      Array.prototype.forEach.call(
        document.querySelectorAll("img[data-emo]"),
        function (im) {
          if (im.complete && im.naturalWidth === 0) swapToEmoji(im);
          else
            im.addEventListener("error", function () {
              swapToEmoji(im);
            });
        },
      );

      /* ===== android manifest (home screen icon) ===== */
      try {
        var iconUrl = new URL("images/icon.png", location.href).href;
        var manifest = {
          name: "Christmas Island",
          short_name: "Christmas",
          start_url: location.href,
          display: "standalone",
          background_color: "#07222b",
          theme_color: "#0b2f3a",
          icons: [{ src: iconUrl, sizes: "512x512", type: "image/png" }],
        };
        var link = document.createElement("link");
        link.rel = "manifest";
        link.href = URL.createObjectURL(
          new Blob([JSON.stringify(manifest)], { type: "application/json" }),
        );
        document.head.appendChild(link);
      } catch (e) {}

      /* ===== mute state ===== */
      var muted = false;
      try {
        muted = localStorage.getItem("christmasMuted") === "1";
      } catch (e) {}
      var muteBtn = document.getElementById("mute");
      function showMute() {
        muteBtn.textContent = muted ? "🔇" : "🔊";
        muteBtn.classList.toggle("off", muted);
        muteBtn.setAttribute(
          "aria-label",
          muted ? "Unmute music" : "Mute music",
        );
      }
      showMute();

      /* ===== background music: "Jingle Bells" (public domain) with sleigh bells =====
         made with Web Audio, no file needed */
      var ctx = null,
        master = null,
        timer = null,
        started = false,
        noiseBuf = null;
      var events = [],
        evIndex = 0,
        loopStart = 0;
      var beat = 60 / TEMPO_BPM;
      var LOOP_BEATS = 64; // 16 bars of 4 beats

      function hz(m) {
        return 440 * Math.pow(2, (m - 69) / 12);
      }

      (function buildSong() {
        // melody as [midi note, beats]
        var E = 76,
          G = 79,
          C = 72,
          D = 74,
          F = 77;
        var melody = [
          // bar 1-2: Jin-gle bells, jin-gle bells
          [E, 1],
          [E, 1],
          [E, 2],
          [E, 1],
          [E, 1],
          [E, 2],
          // bar 3-4: jin-gle all the way
          [E, 1],
          [G, 1],
          [C, 1.5],
          [D, 0.5],
          [E, 4],
          // bar 5-6: oh what fun it is to ride
          [F, 1],
          [F, 1],
          [F, 1.5],
          [F, 0.5],
          [F, 1],
          [E, 1],
          [E, 1],
          [E, 0.5],
          [E, 0.5],
          // bar 7-8: in a one-horse o-pen sleigh
          [E, 1],
          [D, 1],
          [D, 1],
          [E, 1],
          [D, 2],
          [G, 2],
          // bar 9-12: repeat
          [E, 1],
          [E, 1],
          [E, 2],
          [E, 1],
          [E, 1],
          [E, 2],
          [E, 1],
          [G, 1],
          [C, 1.5],
          [D, 0.5],
          [E, 4],
          // bar 13-16: ending
          [F, 1],
          [F, 1],
          [F, 1.5],
          [F, 0.5],
          [F, 1],
          [E, 1],
          [E, 1],
          [E, 0.5],
          [E, 0.5],
          [G, 1],
          [G, 1],
          [F, 1],
          [D, 1],
          [C, 4],
        ];
        var t = 0;
        melody.forEach(function (n) {
          events.push({
            t: t,
            m: [n[0]],
            d: n[1] * 0.92,
            v: 0.5,
            w: "triangle",
            bell: true,
          });
          t += n[1];
        });

        // chords per bar: C, F or G
        var bars = "CCCCFCCGCCCCFCGC".split("");
        var CH = {
          C: { root: 48, tri: [60, 64, 67] },
          F: { root: 41, tri: [57, 60, 65] },
          G: { root: 43, tri: [59, 62, 67] },
        };
        for (var b = 0; b < 16; b++) {
          var c = CH[bars[b]];
          var s = b * 4;
          events.push({ t: s, m: [c.root], d: 1.4, v: 0.5, w: "sine" });
          events.push({ t: s + 1, m: c.tri, d: 0.7, v: 0.16, w: "triangle" });
          events.push({
            t: s + 2,
            m: [c.root + 7],
            d: 1.2,
            v: 0.36,
            w: "sine",
          });
          events.push({ t: s + 3, m: c.tri, d: 0.7, v: 0.16, w: "triangle" });
        }

        // sleigh bells on every half beat
        for (var h = 0; h < LOOP_BEATS * 2; h++) {
          events.push({
            t: h / 2,
            noise: true,
            v: h % 2 === 0 ? 0.1 : 0.17,
          });
        }
        events.sort(function (a, b) {
          return a.t - b.t;
        });
      })();

      function playNote(freq, when, durBeats, vol, wave, bell) {
        var dur = durBeats * beat;
        var o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = wave;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(vol, when + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, when + dur + 0.3);
        o.connect(g);
        g.connect(master);
        o.start(when);
        o.stop(when + dur + 0.4);
        if (bell) {
          // glassy bell overtone
          var o2 = ctx.createOscillator(),
            g2 = ctx.createGain();
          o2.type = "sine";
          o2.frequency.value = freq * 2;
          g2.gain.setValueAtTime(0.0001, when);
          g2.gain.linearRampToValueAtTime(vol * 0.3, when + 0.01);
          g2.gain.exponentialRampToValueAtTime(0.0001, when + dur * 0.7 + 0.25);
          o2.connect(g2);
          g2.connect(master);
          o2.start(when);
          o2.stop(when + dur + 0.3);
        }
      }

      function playShake(when, vol) {
        var src = ctx.createBufferSource();
        src.buffer = noiseBuf;
        var f = ctx.createBiquadFilter();
        f.type = "highpass";
        f.frequency.value = 6500;
        var g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(vol, when + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, when + 0.09);
        src.connect(f);
        f.connect(g);
        g.connect(master);
        src.start(when);
        src.stop(when + 0.12);
      }

      function schedule() {
        if (!ctx) return;
        while (true) {
          var e = events[evIndex];
          var when = loopStart + e.t * beat;
          if (when > ctx.currentTime + 0.5) break;
          if (when >= ctx.currentTime - 0.05) {
            if (e.noise) playShake(when, e.v);
            else
              for (var i = 0; i < e.m.length; i++)
                playNote(hz(e.m[i]), when, e.d, e.v, e.w, e.bell);
          }
          evIndex++;
          if (evIndex >= events.length) {
            evIndex = 0;
            loopStart += LOOP_BEATS * beat;
          }
        }
      }

      function startMusic() {
        if (started) {
          if (ctx && ctx.state === "suspended") ctx.resume();
          return;
        }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : MUSIC_VOLUME;
        master.connect(ctx.destination);
        // white noise for the sleigh bells
        noiseBuf = ctx.createBuffer(
          1,
          Math.floor(ctx.sampleRate * 0.2),
          ctx.sampleRate,
        );
        var data = noiseBuf.getChannelData(0);
        for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        loopStart = ctx.currentTime + 0.2;
        evIndex = 0;
        timer = setInterval(schedule, 100);
        started = true;
        if (ctx.state === "suspended") ctx.resume();
      }

      muteBtn.addEventListener("click", function () {
        muted = !muted;
        try {
          localStorage.setItem("christmasMuted", muted ? "1" : "0");
        } catch (e) {}
        showMute();
        if (!muted) startMusic();
        if (master)
          master.gain.setTargetAtTime(
            muted ? 0 : MUSIC_VOLUME,
            ctx.currentTime,
            0.05,
          );
      });
      function resumeAudio() {
        if (ctx && ctx.state !== "running") {
          var p = ctx.resume();
          if (p && p.catch) p.catch(function () {});
        }
      }
      ["touchend", "click"].forEach(function (ev) {
        document.addEventListener(ev, resumeAudio, true);
      });
      document.addEventListener("visibilitychange", function () {
        if (!ctx) return;
        if (document.hidden) ctx.suspend();
        else resumeAudio();
      });

      /* ===== loading screen ===== */
      var imgs = [
        "images/santa.png",
        "images/reindeer.png",
        "images/snowman.png",
        "images/tree.png",
        "images/present.png",
        "images/Cicon.jpg",
      ];
      var loaded = 0,
        t0 = Date.now();
      var fill = document.getElementById("barFill");
      var startBtn = document.getElementById("startBtn");
      var loaderEl = document.getElementById("loader");

      function oneDone() {
        loaded++;
        fill.style.width = Math.round((loaded / imgs.length) * 100) + "%";
        if (loaded === imgs.length) {
          var wait = Math.max(0, MIN_LOAD_MS - (Date.now() - t0));
          setTimeout(function () {
            document.querySelector("#loader h2").textContent = "Ready!";
            startBtn.style.display = "block";
          }, wait);
        }
      }
      imgs.forEach(function (src) {
        var im = new Image();
        im.onload = oneDone;
        im.onerror = oneDone; // keep going even if an image is missing
        im.src = src;
      });
      setTimeout(function () {
        if (loaded < imgs.length) {
          loaded = imgs.length - 1;
          oneDone();
        }
      }, 8000);
      startBtn.addEventListener("click", function () {
        if (!muted) startMusic();
        loaderEl.classList.add("hide");
        setTimeout(function () {
          loaderEl.style.display = "none";
        }, 700);
      });
      /* ===== audio keep-alive ===== */
      try {
        if (navigator.audioSession) navigator.audioSession.type = "playback";
      } catch (e) {}
      function wakeAudio() {
        if (ctx && !muted && !document.hidden && ctx.state !== "running") {
          var p = ctx.resume();
          if (p && p.catch) p.catch(function () {});
        }
      }
      setInterval(wakeAudio, 1000);
      ["touchend", "click"].forEach(function (ev) {
        document.addEventListener(ev, wakeAudio, true);
      });
    </script>
  </body>
</html>
