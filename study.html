<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Study</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b2f3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Christmas" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="images/icon.png" />
    <link rel="icon" type="image/png" href="images/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Mountains+of+Christmas:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg1: #07222b;
        --bg2: #0e4150;
        --bg3: #1b6b6f;
        --red: #d7263d;
        --gold: #ffcf4a;
        --cream: #fffaf0;
        --green: #38c172;
        --ink: #8c1226;
        --font:
          "Fredoka", "Chalkboard SE", "Hiragino Maru Gothic ProN",
          "Comic Sans MS", system-ui, sans-serif;
        --title:
          "Mountains of Christmas", "Fredoka", "Hiragino Maru Gothic ProN",
          cursive, system-ui, sans-serif;
        --top: calc(env(safe-area-inset-top, 0px) + 88px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg1);
        font-family: var(--font);
        color: var(--cream);
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      body {
        background:
          radial-gradient(
            ellipse at 15% 0%,
            rgba(80, 220, 160, 0.28),
            transparent 45%
          ),
          radial-gradient(
            ellipse at 90% 10%,
            rgba(215, 38, 61, 0.22),
            transparent 40%
          ),
          linear-gradient(
            180deg,
            var(--bg1) 0%,
            var(--bg2) 60%,
            var(--bg3) 100%
          );
      }

      /* ---------- decorations ---------- */
      #lights {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(env(safe-area-inset-top, 0px) + 30px);
        z-index: 3;
        pointer-events: none;
      }
      .bulb {
        position: absolute;
        width: 10px;
        height: 15px;
        border-radius: 50% 50% 55% 55%;
        background: var(--c);
        box-shadow: 0 0 10px 3px var(--c);
        animation: glow 1.8s infinite ease-in-out;
      }
      .bulb::before {
        content: "";
        position: absolute;
        left: 2px;
        top: -4px;
        width: 6px;
        height: 5px;
        background: #2b3a3f;
        border-radius: 2px;
      }
      @keyframes glow {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }
      .flake {
        position: fixed;
        top: -10px;
        border-radius: 50%;
        background: #fff;
        z-index: 0;
        pointer-events: none;
        animation: snowfall linear infinite;
      }
      @keyframes snowfall {
        from {
          transform: translate(0, -5vh);
        }
        to {
          transform: translate(var(--dx), 108vh);
        }
      }

      /* ---------- top buttons ---------- */
      .round {
        position: fixed;
        z-index: 30;
        top: calc(env(safe-area-inset-top, 0px) + 32px);
        width: clamp(44px, 7.6vmin, 58px);
        height: clamp(44px, 7.6vmin, 58px);
        border-radius: 50%;
        border: 3px solid #fff;
        background: var(--red);
        font-size: clamp(22px, 4.2vmin, 32px);
        cursor: pointer;
        color: #fff;
        font-family: var(--font);
        font-weight: 700;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .round:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      #back {
        left: calc(env(safe-area-inset-left, 0px) + 12px);
      }
      #mute {
        right: calc(env(safe-area-inset-right, 0px) + 12px);
      }
      #mute.off {
        background: #5d7078;
      }

      /* ---------- screens ---------- */
      .screen {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--top) calc(env(safe-area-inset-right, 0px) + 14px)
          calc(env(safe-area-inset-bottom, 0px) + 12px)
          calc(env(safe-area-inset-left, 0px) + 14px);
        gap: 2.4vmin;
        text-align: center;
      }
      .screen.active {
        display: flex;
      }
      h1,
      #dMsg h2 {
        font-family: var(--title);
        font-size: clamp(34px, 8.6vmin, 70px);
        line-height: 1.05;
        color: #fff;
        font-weight: 700;
        text-shadow:
          0 4px 0 var(--red),
          0 0 26px rgba(255, 207, 74, 0.55);
      }
      .sub {
        font-size: clamp(15px, 3.2vmin, 26px);
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #5a1a00;
        background: var(--gold);
        padding: 0.1em 0.9em;
        border-radius: 40px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
      }
      .sub:empty {
        display: none;
      }
      .hud {
        display: flex;
        gap: clamp(8px, 2.4vmin, 26px);
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        font-size: clamp(15px, 3.2vmin, 26px);
        font-weight: 700;
        color: var(--gold);
        flex: none;
      }
      .hud span {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 30px;
        padding: 3px 16px;
        white-space: nowrap;
      }
      .top {
        justify-content: flex-start;
        padding-top: calc(var(--top) - 8px);
        gap: 1.4vmin;
      }

      .choices {
        display: flex;
        gap: clamp(12px, 3vmin, 28px);
        flex-wrap: wrap;
        justify-content: center;
        width: min(94vw, 900px);
      }
      .big {
        font-family: var(--font);
        color: #fff;
        cursor: pointer;
        border: 4px solid rgba(255, 255, 255, 0.9);
        border-radius: clamp(18px, 3.6vmin, 30px);
        padding: clamp(10px, 2vmin, 20px) clamp(18px, 4vmin, 40px);
        min-width: clamp(140px, 26vmin, 240px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6vmin;
        box-shadow:
          0 8px 0 rgba(0, 0, 0, 0.35),
          0 14px 26px rgba(0, 0, 0, 0.3);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .big:active {
        transform: translateY(6px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .big b {
        font-size: clamp(22px, 4.8vmin, 40px);
        font-weight: 700;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .red {
        background: linear-gradient(160deg, #ff5a6e, #b81830);
      }
      .green {
        background: linear-gradient(160deg, #38c172, #14753a);
      }
      .blue {
        background: linear-gradient(160deg, #5bc0f8, #1b73c4);
      }

      /* ---------- hub: four wrapped presents ---------- */
      .menu {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: clamp(12px, 2.8vmin, 28px);
        width: min(92vw, 620px, calc(100vh - 300px));
      }
      button.card {
        --c1: #ff5a6e;
        --c2: #b81830;
        --rib: var(--gold);
        --ink: #8c1226;
        font-family: var(--font);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 0.8vmin;
        color: #fff;
        border: 0;
        border-radius: clamp(12px, 2.6vmin, 22px);
        padding: clamp(8px, 1.8vmin, 18px);
        padding-top: clamp(14px, 3.4vmin, 30px);
        aspect-ratio: 1/1;
        position: relative;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.26) 0 17%,
            rgba(0, 0, 0, 0.18) 17% 18.5%,
            transparent 18.5%
          ),
          linear-gradient(160deg, var(--c1), var(--c2));
        box-shadow:
          0 8px 0 rgba(0, 0, 0, 0.38),
          0 14px 26px rgba(0, 0, 0, 0.4),
          inset 0 0 0 3px rgba(255, 255, 255, 0.28);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      button.card:active {
        transform: translateY(6px);
        box-shadow:
          0 2px 0 rgba(0, 0, 0, 0.38),
          inset 0 0 0 3px rgba(255, 255, 255, 0.28);
      }
      button.card::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 15%;
        transform: translateX(-50%);
        background:
          linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.12),
            rgba(255, 255, 255, 0.35) 50%,
            rgba(0, 0, 0, 0.12)
          ),
          var(--rib);
        z-index: 0;
      }
      button.card::after {
        content: "🎀";
        position: absolute;
        top: calc(-1 * clamp(10px, 2.6vmin, 22px));
        left: 50%;
        transform: translateX(-50%);
        font-size: clamp(24px, 6vmin, 48px);
        line-height: 1;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35));
        z-index: 3;
      }
      .card img {
        position: relative;
        z-index: 1;
        width: 58%;
        height: auto;
        max-height: 56%;
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.4));
        animation: bob 3s ease-in-out infinite;
      }
      .card:nth-child(2) img {
        animation-delay: -0.7s;
      }
      .card:nth-child(3) img {
        animation-delay: -1.4s;
      }
      .card:nth-child(4) img {
        animation-delay: -2.1s;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      .card .lbl {
        position: relative;
        z-index: 2;
        font-size: clamp(16px, 3.6vmin, 28px);
        font-weight: 700;
        color: var(--ink);
        background: var(--cream);
        padding: 0.12em 0.8em;
        border-radius: 40px;
        line-height: 1.15;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      }
      .card .num {
        position: absolute;
        z-index: 4;
        top: 8px;
        left: 10px;
        width: clamp(26px, 5vmin, 40px);
        height: clamp(26px, 5vmin, 40px);
        border-radius: 50%;
        background: #fff;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(14px, 3vmin, 24px);
        font-weight: 700;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      }
      .c1 {
        --c1: #ff5a6e;
        --c2: #b81830;
        --rib: #ffcf4a;
        --ink: #a0132a;
      }
      .c2 {
        --c1: #38c172;
        --c2: #14753a;
        --rib: #ffe9a0;
        --ink: #0f5e2f;
      }
      .c3 {
        --c1: #5bc0f8;
        --c2: #1b73c4;
        --rib: #ffffff;
        --ink: #14589a;
      }
      .c4 {
        --c1: #ffc83d;
        --c2: #e08a00;
        --rib: #d7263d;
        --ink: #8a4a00;
      }
      @media (orientation: landscape) {
        .menu {
          grid-template-columns: repeat(4, 1fr);
          width: min(94vw, 1000px);
        }
        button.card {
          aspect-ratio: auto;
          height: min(42vh, 270px);
        }
        .card img {
          max-height: 54%;
          width: auto;
          max-width: 75%;
        }
      }

      /* ---------- viewer (words + sentences) ---------- */
      #vCard {
        flex: 1;
        min-height: 0;
        width: min(96vw, 920px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4vmin;
        padding: 2vmin;
        border: 6px solid transparent;
        border-radius: 28px;
        background:
          linear-gradient(#0a3340, #0a3340) padding-box,
          repeating-linear-gradient(45deg, var(--red) 0 12px, #fff 12px 24px)
            border-box;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      }
      #vPic {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #vImg {
        max-width: 92%;
        max-height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4));
        animation: pop 0.35s;
      }
      #vEmoji {
        font-size: clamp(70px, 22vmin, 200px);
        display: none;
        animation: pop 0.35s;
      }
      @keyframes pop {
        0% {
          transform: scale(0.7);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      #vText {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1vmin;
        width: 100%;
      }
      #vMain {
        font-size: clamp(30px, 7.5vmin, 64px);
        font-weight: 700;
        background: var(--cream);
        color: #0f4a2c;
        border-radius: 24px;
        padding: 0.1em 0.6em;
        border: 4px solid #fff;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
        line-height: 1.2;
        max-width: 100%;
      }
      #vMain.sent {
        font-size: clamp(20px, 4.6vmin, 40px);
      }
      .hl {
        color: var(--red);
        text-decoration: underline;
        text-decoration-thickness: 3px;
        text-underline-offset: 4px;
      }
      #vJp {
        font-size: clamp(20px, 4.6vmin, 38px);
        color: var(--gold);
        font-weight: 700;
        line-height: 1.3;
      }
      #vNav {
        display: flex;
        gap: clamp(10px, 3vmin, 24px);
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .nav {
        font-family: var(--font);
        font-weight: 700;
        font-size: clamp(20px, 4.4vmin, 34px);
        color: #fff;
        cursor: pointer;
        min-width: clamp(64px, 14vmin, 100px);
        height: clamp(52px, 10vmin, 72px);
        padding: 0 clamp(14px, 3vmin, 28px);
        border-radius: 40px;
        border: 4px solid #fff;
        background: linear-gradient(160deg, #ff5a6e, #b81830);
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
      }
      .nav:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      .nav:disabled {
        opacity: 0.35;
        pointer-events: none;
      }
      .nav.say {
        background: linear-gradient(160deg, #38c172, #14753a);
      }
      .nav.go {
        background: linear-gradient(160deg, #5bc0f8, #1b73c4);
      }
      @media (orientation: landscape) {
        #vCard {
          flex-direction: row;
          gap: 3vw;
        }
        #vPic {
          flex: 1;
          height: 100%;
        }
        #vText {
          flex: 1.2;
        }
      }

      /* ---------- drag and drop ---------- */
      #dHelp {
        font-size: clamp(14px, 3vmin, 24px);
        color: var(--gold);
        font-weight: 500;
        flex: none;
      }
      #dCards {
        flex: 1;
        min-height: 0;
        width: min(96vw, 1000px);
        display: grid;
        gap: clamp(8px, 2vmin, 18px);
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }
      .dcard {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        background: var(--cream);
        border: 4px solid #fff;
        border-radius: clamp(12px, 2.6vmin, 22px);
        padding: 6px;
        box-shadow:
          0 5px 0 rgba(0, 0, 0, 0.35),
          inset 0 5px 0 rgba(215, 38, 61, 0.85);
        transition: transform 0.12s;
      }
      .dcard img {
        flex: 1 1 0;
        min-height: 0;
        max-width: 92%;
        object-fit: contain;
        pointer-events: none;
      }
      .slot {
        flex: none;
        width: 92%;
        min-height: clamp(30px, 6vmin, 48px);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px dashed #7fb8c8;
        border-radius: 14px;
        color: #0f4a2c;
        font-weight: 700;
        font-size: clamp(15px, 3.2vmin, 26px);
        line-height: 1.1;
        padding: 0 4px;
      }
      .dcard.over {
        transform: scale(1.05);
        border-color: var(--gold);
        box-shadow:
          0 0 0 5px rgba(255, 207, 74, 0.7),
          0 5px 0 rgba(0, 0, 0, 0.35);
      }
      .dcard.done {
        background: #e8ffe8;
        border-color: var(--green);
      }
      .dcard.done .slot {
        border: 3px solid var(--green);
        color: #1f8a3a;
        background: #fff;
      }
      .dcard.shake {
        animation: shake 0.4s;
        border-color: #ff4d4d;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-9px);
        }
        75% {
          transform: translateX(9px);
        }
      }
      #dTray {
        display: flex;
        flex-wrap: wrap;
        gap: clamp(6px, 1.6vmin, 14px);
        justify-content: center;
        width: min(96vw, 900px);
        flex: none;
        min-height: clamp(44px, 8vmin, 64px);
      }
      .chip {
        font-family: var(--font);
        font-weight: 700;
        font-size: clamp(17px, 3.6vmin, 30px);
        color: #fff;
        padding: 0.25em 0.9em;
        border-radius: 40px;
        border: 3px solid #fff;
        background: linear-gradient(160deg, #ff5a6e, #b81830);
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        touch-action: none;
        cursor: grab;
        -webkit-user-select: none;
        user-select: none;
      }
      .chip.sel {
        outline: 4px solid var(--gold);
        transform: translateY(-3px);
      }
      .chip.lift {
        opacity: 0.3;
      }
      .chip.used {
        display: none;
      }
      .chip.ghost {
        position: fixed;
        z-index: 60;
        pointer-events: none;
        transform: translate(-50%, -60%) scale(1.15);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      }
      #dMsg {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vmin;
        background: rgba(7, 34, 43, 0.9);
        text-align: center;
        padding: 20px;
      }
      #dMsg.show {
        display: flex;
      }
      @media (orientation: landscape) and (max-height: 500px) {
        #dCards {
          grid-template-columns: repeat(6, minmax(0, 1fr));
          grid-template-rows: 1fr;
        }
      }

      /* ---------- quiz ---------- */
      #qBody {
        flex: 1;
        min-height: 0;
        width: min(96vw, 900px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4vmin;
      }
      #qPrompt {
        font-size: clamp(16px, 3.6vmin, 28px);
        color: var(--gold);
        font-weight: 700;
        flex: none;
      }
      #qPic {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #qImg {
        max-width: 92%;
        max-height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4));
      }
      #qBig {
        display: none;
        font-size: clamp(34px, 9vmin, 72px);
        font-weight: 700;
        background: var(--cream);
        color: #0f4a2c;
        border-radius: 24px;
        padding: 0.1em 0.6em;
        border: 4px solid #fff;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
        line-height: 1.25;
        max-width: 100%;
      }
      #qBig.sent {
        font-size: clamp(20px, 4.6vmin, 40px);
      }
      #qSub {
        display: none;
        font-size: clamp(18px, 4vmin, 32px);
        color: var(--gold);
        font-weight: 700;
        line-height: 1.3;
      }
      #qOpts {
        flex: none;
        width: min(96vw, 860px);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(8px, 2vmin, 18px);
      }
      .qopt {
        font-family: var(--font);
        font-weight: 700;
        font-size: clamp(19px, 4.4vmin, 36px);
        color: #0e3d4a;
        background: var(--cream);
        cursor: pointer;
        border: 5px solid #fff;
        border-radius: clamp(14px, 3vmin, 24px);

      .screen.scroll {
        justify-content: flex-start;

        gap: 2vmin;
        padding-bottom: 30px;

      }

        min-width: clamp(100px, 22vmin, 200px);

      }

    <script>

      /* useful Christmas phrases (shown with an emoji instead of a picture) */
      var PHRASES = [

      ];

      var $ = function (id) {
        return document.getElementById(id);
      };
      function shuffle(a) {
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      /* ===== twinkling string lights ===== */
      var LIGHT_COLORS = [
        "#ff4d5e",
        "#ffd54a",
        "#4ade80",
        "#5bc0f8",
        "#ff9ad5",
      ];
      function buildLights() {
        var box = $("lights");
        box.innerHTML = "";
        var inset = parseFloat(getComputedStyle(box).height) - 30 || 0;
        var gap = 32;
        var n = Math.ceil(window.innerWidth / gap) + 1;
        for (var i = 0; i < n; i++) {
          var b = document.createElement("div");
          b.className = "bulb";
          var sag = Math.sin((Math.PI * (i % 6)) / 6) * 8;
          b.style.left = i * gap + 4 + "px";
          b.style.top = inset + 5 + sag + "px";
          b.style.setProperty("--c", LIGHT_COLORS[i % LIGHT_COLORS.length]);
          b.style.animationDelay = -((i * 0.37) % 1.8) + "s";
          box.appendChild(b);
        }
      }
      buildLights();
      window.addEventListener("resize", buildLights);

      /* ===== snowfall ===== */
      (function () {
        var sky = $("sky");
        for (var i = 0; i < 40; i++) {
          var f = document.createElement("div");
          f.className = "flake";
          var s = 3 + Math.random() * 6;
          f.style.width = s + "px";
          f.style.height = s + "px";
          f.style.left = Math.random() * 100 + "vw";
          f.style.opacity = 0.4 + Math.random() * 0.5;
          f.style.animationDuration = 8 + Math.random() * 9 + "s";
          f.style.animationDelay = -Math.random() * 16 + "s";
          f.style.setProperty("--dx", Math.random() * 16 - 8 + "vw");
          sky.appendChild(f);
        }
      })();

      /* ===== mute state (shared with the other pages) ===== */
      var muted = false;
      try {
        muted = localStorage.getItem("christmasMuted") === "1";
      } catch (e) {}
      var muteBtn = $("mute");
      function showMute() {
        muteBtn.textContent = muted ? "🔇" : "🔊";
        muteBtn.classList.toggle("off", muted);
        muteBtn.setAttribute(
          "aria-label",
          muted ? "Unmute music" : "Mute music",
        );
      }
      showMute();

      /* ===== sound effects (no background music on this page) ===== */
      var ctx = null,
        sfxGain = null,
        started = false;

      /* let iPhone play speech even with the silent switch on */
      try {
        if (navigator.audioSession) navigator.audioSession.type = "playback";
      } catch (e) {}

      function startAudio() {
        if (started) {
          if (ctx && ctx.state === "suspended") ctx.resume();
          return;
        }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        sfxGain = ctx.createGain();
        sfxGain.gain.value = muted ? 0 : SFX_VOLUME;
        sfxGain.connect(ctx.destination);
        started = true;
        if (ctx.state === "suspended") ctx.resume();
      }
      /* audio and speech are unlocked on the first tap (browsers need a tap) */
      function firstTap() {
        document.removeEventListener("click", firstTap, true);
        document.removeEventListener("touchend", firstTap, true);
        document.removeEventListener("pointerup", firstTap, true);
        try {
          if (window.speechSynthesis) {
            var u0 = new SpeechSynthesisUtterance(" ");
            u0.volume = 0;
            speechSynthesis.speak(u0);
          }
        } catch (e) {}
        if (!muted) startAudio();
      }
      document.addEventListener("click", firstTap, true);
      document.addEventListener("touchend", firstTap, true);
      document.addEventListener("pointerup", firstTap, true);

      muteBtn.addEventListener("click", function () {
        muted = !muted;
        try {
          localStorage.setItem("christmasMuted", muted ? "1" : "0");
        } catch (e) {}
        showMute();
        if (!muted && !started) startAudio();
        if (ctx) {
          sfxGain.gain.setTargetAtTime(
            muted ? 0 : SFX_VOLUME,
            ctx.currentTime,
            0.05,
          );
        }
      });
      document.addEventListener("visibilitychange", function () {
        if (document.hidden && window.speechSynthesis) speechSynthesis.cancel();
        if (!ctx) return;
        if (document.hidden) ctx.suspend();
        else ctx.resume();
      });

      /* one sound: freq, delay, length, wave, volume, optional glide-to freq */
      function blip(freq, delay, dur, type, vol, glideTo) {
        if (!ctx || muted) return;
        var t = ctx.currentTime + (delay || 0);
        var o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t);
        if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol || 1, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(sfxGain);
        o.start(t);
        o.stop(t + dur + 0.05);
      }
      function jingleRight() {
        [587, 740, 880, 1175].forEach(function (f, i) {
          blip(f, i * 0.09, 0.26, "triangle", 1);
        });
        blip(1760, 0.36, 0.45, "sine", 0.3);
      }
      function jingleWrong() {
        blip(247, 0, 0.22, "sine", 1, 185);
        blip(196, 0.2, 0.4, "sine", 1, 130);
      }
      function jingleWin() {
        [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) {
          blip(f, i * 0.14, 0.3, "triangle", 1);
        });
      }

      /* ===== voice (the device's built-in speech) ===== */
      var voice = null,
        speakTimer = null,
        lastUtter = null;
      function pickVoice() {
        if (!window.speechSynthesis) return;
        var vs = speechSynthesis.getVoices(),
          pick = null;
        for (var i = 0; i < vs.length; i++) {
          var l = (vs[i].lang || "").replace("_", "-");
          if (l === "en-US" && vs[i].localService) {
            pick = vs[i];
            break;
          }
        }
        voice = pick; // null = let the device choose by language
      }
      if (window.speechSynthesis) {
        pickVoice();
        speechSynthesis.onvoiceschanged = pickVoice;
      }
      function speak(text, delay) {
        if (!window.speechSynthesis) return;
        clearTimeout(speakTimer);

          try {
            var busy = speechSynthesis.speaking || speechSynthesis.pending;
            if (busy) speechSynthesis.cancel();

                  speechSynthesis.resume();
                  var u = new SpeechSynthesisUtterance(text);
                  u.lang = "en-US";

                  u.rate = VOICE_RATE;
                  u.pitch = 1.05;
                  u.volume = 1;

      /* ===== viewer: words and sentences ===== */
      var vMode = "words",

      function openViewer(m) {
        vMode = m;

      }
      function setSentence(el, text, word) {
        el.innerHTML = "";
        var k = word ? text.toLowerCase().indexOf(word.toLowerCase()) : -1;
        if (k < 0) {
          el.textContent = text;
          return;
        }
        el.appendChild(document.createTextNode(text.slice(0, k)));
        var h = document.createElement("span");
        h.className = "hl";
        h.textContent = text.slice(k, k + word.length);
        el.appendChild(h);
        el.appendChild(document.createTextNode(text.slice(k + word.length)));
      }
      function renderV() {
        var d = vDeck[vi],
          last = vi === vDeck.length - 1;
        $("vTitle").textContent = vMode === "words" ? "Words" : "Sentences";
        $("vCount").textContent = vi + 1 + "/" + vDeck.length;
        var img = $("vImg"),
          emo = $("vEmoji");
        if (d.e) {
          img.style.display = "none";
          emo.style.display = "block";
          emo.textContent = d.e;
        } else {
          emo.style.display = "none";
          img.style.display = "";
          img.style.visibility = "";
          img.style.animation = "none";
          void img.offsetWidth;
          img.style.animation = "";
          img.onerror = function () {
            img.style.visibility = "hidden";
          };
          img.src = IMG_FOLDER + d.f;

        var main = $("vMain");
        if (vMode === "words") {
          main.className = "";
          main.textContent = d.w;
          $("vJp").textContent = d.jp;
        } else {
          main.className = "sent";
          setSentence(main, d.s, d.e ? "" : d.w);
          $("vJp").innerHTML = d.sj;
        }
        $("vPrev").disabled = vi === 0;
        var nx = $("vNext");
        if (last) {
          nx.textContent = vMode === "words" ? "Sentences ▶" : "Drag & drop ▶";
          nx.classList.add("go");
        } else {
          nx.textContent = "▶";
          nx.classList.remove("go");
        }
        speak(vMode === "words" ? d.w : d.s, 250);
      }
      $("vPrev").addEventListener("click", function () {
        if (vi > 0) {
          vi--;
          renderV();
        }
      });
      $("vNext").addEventListener("click", function () {
        if (vi < vDeck.length - 1) {
          vi++;
          renderV();
        } else if (vMode === "words") openViewer("sent");
        else startDrag();
      });
      $("vSay").addEventListener("click", function () {
        var d = vDeck[vi];
        speak(vMode === "words" ? d.w : d.s, 0);
      });
      $("vCard").addEventListener("click", function () {
        var d = vDeck[vi];
        speak(vMode === "words" ? d.w : d.s, 0);
      });

      /* ===== drag and drop practice ===== */
      var dWords = [],
        dRound = 0,
        dPlaced = 0,
        selected = null,
        dragging = null;

      function startDrag() {
        dWords = shuffle(ITEMS.slice());
        dRound = 0;
        show("drag");
        loadRound();
      }
      function loadRound() {
        var set = dWords.slice(dRound * 6, dRound * 6 + 6);
        dPlaced = 0;
        selected = null;
        $("dRound").textContent = "Round " + (dRound + 1) + "/3";
        $("dPlaced").textContent = "0/" + set.length;
        var cards = $("dCards");
        cards.innerHTML = "";
        set.forEach(function (it) {
          var c = document.createElement("div");
          c.className = "dcard";
          c.setAttribute("data-w", it.w);
          var im = document.createElement("img");
          im.alt = "";
          im.onerror = function () {
            im.style.visibility = "hidden";
          };
          im.src = IMG_FOLDER + it.f;
          var s = document.createElement("div");
          s.className = "slot";
          s.textContent = "?";
          c.appendChild(im);
          c.appendChild(s);
          cards.appendChild(c);
        });
        var tray = $("dTray");
        tray.innerHTML = "";
        shuffle(set.slice()).forEach(function (it) {
          var ch = document.createElement("div");
          ch.className = "chip";
          ch.textContent = it.w;
          ch.setAttribute("data-w", it.w);
          wireChip(ch);
          tray.appendChild(ch);
        });
      }
      function cardAt(x, y) {
        var el = document.elementFromPoint(x, y);
        return el ? el.closest(".dcard") : null;
      }
      function clearOver() {
        Array.prototype.forEach.call(
          document.querySelectorAll(".dcard.over"),
          function (n) {
            n.classList.remove("over");
          },
        );
      }
      function selectChip(ch) {
        if (selected) selected.classList.remove("sel");
        if (selected === ch) {
          selected = null;
          return;
        }
        selected = ch;
        ch.classList.add("sel");
      }
      function wireChip(ch) {
        ch.addEventListener("pointerdown", function (e) {
          if (ch.classList.contains("used")) return;
          e.preventDefault();
          try {
            ch.setPointerCapture(e.pointerId);
          } catch (err) {}
          dragging = {
            chip: ch,
            id: e.pointerId,
            sx: e.clientX,
            sy: e.clientY,
            moved: false,
            ghost: null,
          };
        });
        ch.addEventListener("pointermove", function (e) {
          var d = dragging;
          if (!d || d.chip !== ch || e.pointerId !== d.id) return;
          if (
            !d.moved &&
            Math.sqrt(
              Math.pow(e.clientX - d.sx, 2) + Math.pow(e.clientY - d.sy, 2),
            ) > 8
          ) {
            d.moved = true;
            d.ghost = ch.cloneNode(true);
            d.ghost.className = "chip ghost";
            document.body.appendChild(d.ghost);
            ch.classList.add("lift");
            if (selected) {
              selected.classList.remove("sel");
              selected = null;
            }
          }
          if (d.moved) {
            d.ghost.style.left = e.clientX + "px";
            d.ghost.style.top = e.clientY + "px";
            clearOver();
            var c = cardAt(e.clientX, e.clientY);
            if (c && !c.classList.contains("done")) c.classList.add("over");
          }
        });
        function end(e, cancel) {
          var d = dragging;
          if (!d || d.chip !== ch) return;
          dragging = null;
          if (d.ghost) d.ghost.remove();
          ch.classList.remove("lift");
          clearOver();
          if (cancel) return;
          if (d.moved) {
            var c = cardAt(e.clientX, e.clientY);
            if (c) drop(ch, c);
          } else {
            selectChip(ch); // a simple tap selects the word; tap a picture to place it
          }
        }
        ch.addEventListener("pointerup", function (e) {
          end(e, false);
        });
        ch.addEventListener("pointercancel", function (e) {
          end(e, true);
        });
      }
      $("dCards").addEventListener("click", function (e) {
        var c = e.target.closest(".dcard");
        if (c && selected) drop(selected, c);
      });
      function drop(chip, card) {
        if (card.classList.contains("done")) return;
        var w = card.getAttribute("data-w");
        if (chip.getAttribute("data-w") === w) {
          card.classList.add("done");
          card.querySelector(".slot").textContent = w;
          chip.classList.add("used");
          chip.classList.remove("sel");
          selected = null;
          dPlaced++;
          var total = Math.min(6, dWords.length - dRound * 6);
          $("dPlaced").textContent = dPlaced + "/" + total;
          jingleRight();
          speak(w, 150);
          if (dPlaced === total) setTimeout(roundDone, 1100);
        } else {
          card.classList.remove("shake");
          void card.offsetWidth;
          card.classList.add("shake");
          setTimeout(function () {
            card.classList.remove("shake");
          }, 450);
          chip.classList.remove("sel");
          selected = null;
          jingleWrong();
        }
      }
      function roundDone() {
        if (current !== "drag") return;
        var lastRound = dRound >= 2;
        $("dMsgText").textContent = lastRound
          ? "Practice complete! 🎉"
          : "Round " + (dRound + 1) + " complete! 🎉";
        $("dNext").querySelector("b").textContent = lastRound
          ? "Start the quiz ▶"
          : "Next round ▶";
        $("dMsg").classList.add("show");
        jingleWin();
      }
      $("dNext").addEventListener("click", function () {
        $("dMsg").classList.remove("show");
        if (dRound >= 2) startQuizzes();
        else {
          dRound++;
          loadRound();
        }
      });

      /* ===== quizzes: 3 quizzes x 8 questions ===== */
      var quizNo = 0,
        qs = [],
        qi = 0,
        qCur = 0,
        scores = [0, 0, 0],
        missedMap = {},
        missedList = [],
        qLock = false,
        quizTimer = null;

      function makeOpts(it) {
        var pool = shuffle(
          ITEMS.filter(function (o) {
            return o !== it && o.w.indexOf(it.w) < 0 && it.w.indexOf(o.w) < 0;
          }),
        );
        return shuffle([it].concat(pool.slice(0, 3)));
      }
      function startQuizzes() {
        quizNo = 0;
        scores = [0, 0, 0];
        missedMap = {};
        missedList = [];
        startQuiz();
      }
      function startQuiz() {
        qs = shuffle(ITEMS.slice())
          .slice(0, QUIZ_QUESTIONS)
          .map(function (it) {
            return { item: it, type: quizNo, opts: makeOpts(it) };
          });
        qi = 0;
        qCur = 0;
        show("quiz");
        showQ();
      }
      function showQ() {
        var q = qs[qi],
          it = q.item;
        qLock = false;
        $("qNo").textContent = "Quiz " + (quizNo + 1) + "/" + QUIZ_COUNT;
        $("qQ").textContent = "Question " + (qi + 1) + "/" + qs.length;
        $("qScore").textContent = "⭐ " + qCur;
        var pic = $("qPic"),
          big = $("qBig"),
          sub = $("qSub");
        pic.style.display = "none";
        big.style.display = "none";
        sub.style.display = "none";
        big.className = "";
        if (q.type === 0) {
          $("qPrompt").textContent = "What is this?";
          var im = $("qImg");
          im.style.visibility = "";
          im.onerror = function () {
            im.style.visibility = "hidden";
            big.style.display = "block";
            big.textContent = "(image missing: " + it.f + ")";
          };
          im.src = IMG_FOLDER + it.f;
          pic.style.display = "flex";
        } else if (q.type === 1) {
          $("qPrompt").textContent = "Choose the English word:";
          big.style.display = "block";
          big.textContent = it.jp;
        } else {
          $("qPrompt").textContent = "Fill in the blank:";
          big.className = "sent";
          big.style.display = "block";
          var k = it.s.toLowerCase().indexOf(it.w.toLowerCase());
          big.textContent =
            it.s.slice(0, k) + "_____" + it.s.slice(k + it.w.length);
          sub.style.display = "block";
          sub.innerHTML = it.sj;
        }
        var box = $("qOpts");
        box.innerHTML = "";
        q.opts.forEach(function (o, i) {
          var b = document.createElement("button");
          b.className = "qopt";
          b.textContent = o.w;
          b.style.animationDelay = i * 0.05 + "s";
          b.addEventListener("click", function () {
            answer(b, o);
          });
          box.appendChild(b);
        });
      }
      function answer(btn, o) {
        if (qLock) return;
        qLock = true;
        var q = qs[qi],
          it = q.item,
          ok = o === it;
        if (ok) {
          btn.classList.add("right");
          qCur++;
          jingleRight();
        } else {
          btn.classList.add("wrong");
          jingleWrong();
          Array.prototype.forEach.call($("qOpts").children, function (b) {
            if (b.textContent === it.w) b.classList.add("right");
          });
          if (!missedMap[it.w]) {
            missedMap[it.w] = true;
            missedList.push(it);
          }
        }
        $("qScore").textContent = "⭐ " + qCur;
        if (q.type === 2) setSentence($("qBig"), it.s, it.w); // show the finished sentence
        speak(q.type === 2 ? it.s : it.w, 350);
        quizTimer = setTimeout(nextQ, q.type === 2 ? 2600 : 1700);
      }
      function nextQ() {
        qi++;
        if (qi >= qs.length) endQuiz();
        else showQ();
      }
      function endQuiz() {
        scores[quizNo] = qCur;
        if (quizNo < QUIZ_COUNT - 1) {
          $("qrTitle").textContent = "Quiz " + (quizNo + 1) + " done!";
          $("qrScore").textContent = qCur + "/" + qs.length;
          $("qrMsg").textContent =
            qCur >= 7
              ? "Amazing! 🌟"
              : qCur >= 5
                ? "Great job! 👍"
                : "Good try! Keep going!";
          $("qrNext").querySelector("b").textContent = "Next quiz ▶";
          show("qresult");
          jingleWin();
        } else {
          showFinal();
        }
      }
      $("qrNext").addEventListener("click", function () {
        quizNo++;
        startQuiz();
      });

      /* ===== final score ===== */
      function showFinal() {
        var total = scores[0] + scores[1] + scores[2],
          max = QUIZ_COUNT * QUIZ_QUESTIONS,
          pct = total / max;
        $("fTotal").textContent = total + "/" + max;
        $("fq1").textContent = scores[0] + "/" + QUIZ_QUESTIONS;
        $("fq2").textContent = scores[1] + "/" + QUIZ_QUESTIONS;
        $("fq3").textContent = scores[2] + "/" + QUIZ_QUESTIONS;
        $("fTitle").textContent =
          pct === 1 ? "Perfect!" : pct >= 0.6 ? "Great job!" : "Good try!";
        var stars = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : 1,
          s = "";
        for (var i = 0; i < 3; i++) s += i < stars ? "⭐" : "☆";
        $("fStars").textContent = s;

        var list = $("missList");
        list.innerHTML = "";
        if (missedList.length) {
          $("missTitle").textContent = "Words to practise:";
          $("perfect").style.display = "none";
          missedList.forEach(function (w) {
            var c = document.createElement("div");
            c.className = "missCard";
            var im = document.createElement("img");
            im.alt = "";
            im.src = IMG_FOLDER + w.f;
            im.onerror = function () {
              im.style.visibility = "hidden";
            };
            var t = document.createElement("div");
            t.className = "w";
            t.textContent = w.w;
            var j = document.createElement("div");
            j.className = "j";
            j.textContent = w.jp;
            c.appendChild(im);
            c.appendChild(t);
            c.appendChild(j);
            list.appendChild(c);
          });
        } else {
          $("missTitle").textContent = "";
          $("perfect").style.display = "block";
        }
        show("final");
        $("final").scrollTop = 0;
        jingleWin();
        confetti();
      }
      function confetti() {
        var box = $("final"),
          em = ["🎄", "⭐", "🎁", "❄️", "🔔", "🍬"];
        for (var i = 0; i < 24; i++) {
          var s = document.createElement("div");
          s.className = "fall";
          s.textContent = em[i % em.length];
          s.style.left = Math.random() * 100 + "%";
          s.style.animationDuration = 3 + Math.random() * 3 + "s";
          s.style.animationDelay = Math.random() * 2 + "s";
          box.appendChild(s);
        }
      }
      function clearConfetti() {
        Array.prototype.forEach.call(
          document.querySelectorAll(".fall"),
          function (n) {
            n.remove();
          },
        );
      }
      $("fAgain").addEventListener("click", startQuizzes);
      $("fMenu").addEventListener("click", function () {
        show("hub");
      });

      /* preload images quietly */
      ITEMS.forEach(function (it) {
        var im = new Image();
        im.src = IMG_FOLDER + it.f;
      });

      /* ===== audio keep-alive (on taps only, never on a timer) ===== */
      function wakeAudio() {
        if (ctx && !muted && !document.hidden && ctx.state !== "running") {
          var p = ctx.resume();
          if (p && p.catch) p.catch(function () {});
        }
      }
      ["touchend", "click"].forEach(function (ev) {
        document.addEventListener(ev, wakeAudio, true);
      });
    </script>
  </body>
</html>
