<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Match up</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b2f3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Christmas" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="images/icon.png" />
    <link rel="icon" type="image/png" href="images/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Mountains+of+Christmas:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg1: #07222b;
        --bg2: #0e4150;
        --bg3: #1b6b6f;
        --red: #d7263d;
        --gold: #ffcf4a;
        --cream: #fffaf0;
        --green: #38c172;
        --font:
          "Fredoka", "Chalkboard SE", "Hiragino Maru Gothic ProN",
          "Comic Sans MS", system-ui, sans-serif;
        --title:
          "Mountains of Christmas", "Fredoka", "Hiragino Maru Gothic ProN",
          cursive, system-ui, sans-serif;
        --top: calc(env(safe-area-inset-top, 0px) + 88px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg1);
        font-family: var(--font);
        color: var(--cream);
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      body {
        background:
          radial-gradient(
            ellipse at 15% 0%,
            rgba(80, 220, 160, 0.28),
            transparent 45%
          ),
          radial-gradient(
            ellipse at 90% 10%,
            rgba(215, 38, 61, 0.22),
            transparent 40%
          ),
          linear-gradient(
            180deg,
            var(--bg1) 0%,
            var(--bg2) 60%,
            var(--bg3) 100%
          );
      }

      /* ---------- decorations ---------- */
      #lights {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(env(safe-area-inset-top, 0px) + 30px);
        z-index: 3;
        pointer-events: none;
      }
      .bulb {
        position: absolute;
        width: 10px;
        height: 15px;
        border-radius: 50% 50% 55% 55%;
        background: var(--c);
        box-shadow: 0 0 10px 3px var(--c);
        animation: glow 1.8s infinite ease-in-out;
      }
      .bulb::before {
        content: "";
        position: absolute;
        left: 2px;
        top: -4px;
        width: 6px;
        height: 5px;
        background: #2b3a3f;
        border-radius: 2px;
      }
      @keyframes glow {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }
      .flake {
        position: fixed;
        top: -10px;
        border-radius: 50%;
        background: #fff;
        z-index: 0;
        pointer-events: none;
        animation: snowfall linear infinite;
      }
      @keyframes snowfall {
        from {
          transform: translate(0, -5vh);
        }
        to {
          transform: translate(var(--dx), 108vh);
        }
      }

      /* ---------- top buttons ---------- */
      .round {
        position: fixed;
        z-index: 30;
        top: calc(env(safe-area-inset-top, 0px) + 32px);
        width: clamp(44px, 7.6vmin, 58px);
        height: clamp(44px, 7.6vmin, 58px);
        border-radius: 50%;
        border: 3px solid #fff;
        background: var(--red);
        font-size: clamp(22px, 4.2vmin, 32px);
        cursor: pointer;
        color: #fff;
        font-family: var(--font);
        font-weight: 700;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .round:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      #back {
        left: calc(env(safe-area-inset-left, 0px) + 12px);
      }
      #mute {
        right: calc(env(safe-area-inset-right, 0px) + 12px);
      }
      #mute.off {
        background: #5d7078;
      }

      /* ---------- screens ---------- */
      .screen {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--top) calc(env(safe-area-inset-right, 0px) + 14px)
          calc(env(safe-area-inset-bottom, 0px) + 12px)
          calc(env(safe-area-inset-left, 0px) + 14px);
        gap: 3vmin;
        text-align: center;
      }
      .screen.active {
        display: flex;
      }
      h1,
      #win h2 {
        font-family: var(--title);
        font-size: clamp(36px, 9.5vmin, 76px);
        line-height: 1.05;
        color: #fff;
        font-weight: 700;
        text-shadow:
          0 4px 0 var(--red),
          0 0 26px rgba(255, 207, 74, 0.55);
      }
      .sub {
        font-size: clamp(15px, 3.2vmin, 26px);
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #5a1a00;
        background: var(--gold);
        padding: 0.1em 0.9em;
        border-radius: 40px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
      }
      .sub:empty {
        display: none;
      }

      .choices {
        display: flex;
        gap: clamp(12px, 3vmin, 28px);
        flex-wrap: wrap;
        justify-content: center;
        width: min(94vw, 900px);
      }
      .big {
        font-family: var(--font);
        color: #fff;
        cursor: pointer;
        border: 4px solid rgba(255, 255, 255, 0.9);
        border-radius: clamp(18px, 3.6vmin, 30px);
        padding: clamp(12px, 2.4vmin, 24px) clamp(18px, 4vmin, 40px);
        min-width: clamp(150px, 30vmin, 260px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6vmin;
        box-shadow:
          0 8px 0 rgba(0, 0, 0, 0.35),
          0 14px 26px rgba(0, 0, 0, 0.3);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .big:active {
        transform: translateY(6px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .big b {
        font-size: clamp(24px, 5.2vmin, 44px);
        font-weight: 700;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .big small {
        font-size: clamp(13px, 2.6vmin, 21px);
        font-weight: 500;
        opacity: 0.95;
      }
      .big .pics {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: clamp(18px, 3.6vmin, 30px);
        font-weight: 700;
      }
      .big .pics img {
        height: clamp(34px, 8vmin, 64px);
        width: auto;
        filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.35));
      }
      .big .pics .w {
        background: var(--cream);
        color: #8c1226;
        border-radius: 40px;
        padding: 2px 12px;
        font-size: clamp(14px, 3vmin, 24px);
      }
      .easy,
      .l1 {
        background: linear-gradient(160deg, #38c172, #14753a);
      }
      .hard,
      .l3 {
        background: linear-gradient(160deg, #ff5a6e, #b81830);
      }
      .l2 {
        background: linear-gradient(160deg, #5bc0f8, #1b73c4);
      }
      .alt {
        background: linear-gradient(160deg, #ffc83d, #e08a00);
      }

      /* ---------- game ---------- */
      #game {
        justify-content: flex-start;
        gap: 1.2vmin;
        padding-top: calc(var(--top) - 14px);
      }
      #hud {
        display: flex;
        gap: clamp(10px, 3vmin, 30px);
        align-items: center;
        justify-content: center;
        font-size: clamp(15px, 3.2vmin, 26px);
        font-weight: 700;
        color: var(--gold);
        flex: none;
      }
      #hud span {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 30px;
        padding: 3px 16px;
      }
      #prog {
        flex: none;
        width: min(80vw, 520px);
        height: clamp(10px, 1.8vmin, 16px);
        border-radius: 20px;
        border: 2px solid #fff;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #progFill {
        display: block;
        height: 100%;
        width: 0;
        background: repeating-linear-gradient(
          -45deg,
          var(--red) 0 8px,
          #fff 8px 16px
        );
        transition: width 0.4s;
      }
      #board {
        position: relative;
        flex: 1;
        width: 100%;
        min-height: 0;
      }
      #grid {
        position: absolute;
        inset: 0;
        display: grid;
        justify-content: center;
        align-content: center;
      }
      .card {
        --c1: #ff5a6e;
        --c2: #b81830;
        --rib: var(--gold);
        perspective: 700px;
        cursor: pointer;
      }
      .card.k1 {
        --c1: #38c172;
        --c2: #14753a;
        --rib: #ffe9a0;
      }
      .card.k2 {
        --c1: #5bc0f8;
        --c2: #1b73c4;
        --rib: #ffffff;
      }
      .card.k3 {
        --c1: #ffc83d;
        --c2: #e08a00;
        --rib: #d7263d;
      }
      .card.k4 {
        --c1: #b57bff;
        --c2: #6b32c9;
        --rib: #ffcf4a;
      }
      .inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.45s;
        transform-style: preserve-3d;
      }
      .card.flipped .inner {
        transform: rotateY(180deg);
      }
      .side {
        position: absolute;
        inset: 0;
        border-radius: 14%/12%;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 3px solid #fff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
      }
      /* the back of each card is a wrapped present */
      .cover {
        background:
          linear-gradient(
            90deg,
            transparent 42%,
            var(--rib) 42% 58%,
            transparent 58%
          ),
          linear-gradient(
            0deg,
            transparent 42%,
            var(--rib) 42% 58%,
            transparent 58%
          ),
          linear-gradient(160deg, var(--c1), var(--c2));
        font-size: calc(var(--cw) * 0.42);
      }
      .cover::after {
        content: "🎀";
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35));
      }
      .face {
        background: var(--cream);
        transform: rotateY(180deg);
        color: #0f4a2c;
      }
      .face img {
        width: 86%;
        height: 86%;
        object-fit: contain;
        pointer-events: none;
      }
      .face .txt {
        font-weight: 700;
        text-align: center;
        line-height: 1.05;
        padding: 4px;
        font-size: max(11px, calc(var(--cw) * 0.17));
      }
      .card.matched .face {
        background: #fff8d6;
        border-color: var(--gold);
        box-shadow: 0 0 16px 5px rgba(255, 207, 74, 0.85);
      }
      .card.matched .inner {
        animation: pop 0.5s;
      }
      @keyframes pop {
        0% {
          transform: rotateY(180deg) scale(1);
        }
        50% {
          transform: rotateY(180deg) scale(1.12);
        }
        100% {
          transform: rotateY(180deg) scale(1);
        }
      }
      .card.wrong .face {
        border-color: #ff4d5e;
      }

      /* ---------- win ---------- */
      #win {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 2.4vmin;
        background: rgba(7, 34, 43, 0.9);
        text-align: center;
        padding: 20px;
        overflow: hidden;
      }
      #win.show {
        display: flex;
      }
      #win p {
        font-size: clamp(18px, 4vmin, 32px);
        color: var(--gold);
        font-weight: 700;
      }
      #winStars {
        font-size: clamp(40px, 10vmin, 80px);
        letter-spacing: 8px;
      }
      #win .choices .big {
        min-width: clamp(120px, 22vmin, 200px);
        padding: clamp(10px, 2vmin, 18px) clamp(14px, 3vmin, 30px);
      }
      .fall {
        position: absolute;
        top: -60px;
        font-size: clamp(24px, 5vmin, 44px);
        animation: confall linear forwards;
        pointer-events: none;
      }
      @keyframes confall {
        to {
          transform: translateY(115vh) rotate(360deg);
        }
      }

      @media (orientation: landscape) and (max-height: 500px) {
        .screen {
          gap: 1.6vh;
        }
        h1 {
          font-size: clamp(26px, 11vh, 54px);
        }
        .sub {
          font-size: clamp(13px, 5vh, 22px);
        }
      }
    </style>
  </head>
  <body>
    <div id="lights"></div>
    <div id="sky"></div>

    <button id="back" class="round" aria-label="Back">&#8592;</button>
    <button
      id="mute"
      class="round"
      aria-label="Mute music"
      title="Music on/off"
    >
      🔊
    </button>

    <!-- screen 1: mode -->
    <section id="modeScreen" class="screen active">
      <h1>Match up!</h1>
      <div class="sub">Choose a mode</div>
      <div class="choices">
        <button class="big easy" id="btnEasy">
          <div class="pics">
            <img src="images/santa.png" alt="" /><span>=</span
            ><img src="images/santa.png" alt="" />
          </div>
          <b>Easy</b><small>Match the pictures</small>
        </button>
        <button class="big hard" id="btnHard">
          <div class="pics">
            <img src="images/present.png" alt="" /><span>=</span
            ><span class="w">present</span>
          </div>
          <b>Difficult</b><small>Match picture + word</small>
        </button>
      </div>
    </section>

    <!-- screen 2: level -->
    <section id="levelScreen" class="screen">
      <h1>Choose a level</h1>
      <div class="sub" id="levelSub"></div>
      <div class="choices">
        <button class="big l1" data-level="1">
          <b>Level 1</b><small>6 pairs</small>
        </button>
        <button class="big l2" data-level="2">
          <b>Level 2</b><small>10 pairs</small>
        </button>
        <button class="big l3" data-level="3">
          <b>Level 3</b><small>18 pairs</small>
        </button>
      </div>
    </section>

    <!-- screen 3: game -->
    <section id="game" class="screen">
      <div id="hud">
        <span id="hudLevel">Level 1</span><span id="hudPairs">Pairs 0/6</span
        ><span id="hudMoves">Moves 0</span>
      </div>
      <div id="prog"><i id="progFill"></i></div>
      <div id="board"><div id="grid"></div></div>
    </section>

    <!-- win -->
    <div id="win">
      <h2>Merry match! 🎉</h2>
      <div id="winStars"></div>
      <p id="winText"></p>
      <div class="choices">
        <button class="big l2" id="btnAgain"><b>Play again</b></button>
        <button class="big l1" id="btnNext"><b>Next level</b></button>
        <button class="big alt" id="btnLevels"><b>Levels</b></button>
      </div>
    </div>

    <script>
      /* ===== settings ===== */
      var MUSIC_VOLUME = 0.1; // background music level (0 to 1)
      var SFX_VOLUME = 0.22; // sound effects level
      var TEMPO_BPM = 120;
      var CARD_RATIO = 1.12; // card height / width
      var FLIP_BACK_MS = 900; // how long a wrong pair stays visible
      var SAY_WORDS = true; // say the word out loud when a pair is found
      var VOICE_RATE = 0.85; // speaking speed (lower = slower)

      /* name shown on word cards, image file inside the images folder */
      var ITEMS = [
        ["Santa", "santa.png"],
        ["reindeer", "reindeer.png"],
        ["sleigh", "sleigh.png"],
        ["elf", "elf.png"],
        ["snowman", "snowman.png"],
        ["snowflake", "snowflake.png"],
        ["Christmas tree", "tree.png"],
        ["star", "star.png"],
        ["decoration", "decoration.png"],
        ["present", "present.png"],
        ["wrapping paper", "wrapping-paper.png"],
        ["toys", "toys.png"],
        ["stocking", "stocking.png"],
        ["candy cane", "candy-cane.png"],
        ["candle", "candle.png"],
        ["bell", "bell.png"],
        ["wreath", "wreath.png"],
        ["Christmas card", "christmas-card.png"],
      ];
      var LEVEL_PAIRS = { 1: 6, 2: 10, 3: 18 };
      var IMG_FOLDER = "images/";

      /* ===== twinkling string lights ===== */
      var LIGHT_COLORS = [
        "#ff4d5e",
        "#ffd54a",
        "#4ade80",
        "#5bc0f8",
        "#ff9ad5",
      ];
      function buildLights() {
        var box = document.getElementById("lights");
        box.innerHTML = "";
        var inset = parseFloat(getComputedStyle(box).height) - 30 || 0;
        var gap = 32;
        var n = Math.ceil(window.innerWidth / gap) + 1;
        for (var i = 0; i < n; i++) {
          var b = document.createElement("div");
          b.className = "bulb";
          var sag = Math.sin((Math.PI * (i % 6)) / 6) * 8;
          b.style.left = i * gap + 4 + "px";
          b.style.top = inset + 5 + sag + "px";
          b.style.setProperty("--c", LIGHT_COLORS[i % LIGHT_COLORS.length]);
          b.style.animationDelay = -((i * 0.37) % 1.8) + "s";
          box.appendChild(b);
        }
      }
      buildLights();
      window.addEventListener("resize", buildLights);

      /* ===== snowfall ===== */
      (function () {
        var sky = document.getElementById("sky");
        for (var i = 0; i < 40; i++) {
          var f = document.createElement("div");
          f.className = "flake";
          var s = 3 + Math.random() * 6;
          f.style.width = s + "px";
          f.style.height = s + "px";
          f.style.left = Math.random() * 100 + "vw";
          f.style.opacity = 0.4 + Math.random() * 0.5;
          f.style.animationDuration = 8 + Math.random() * 9 + "s";
          f.style.animationDelay = -Math.random() * 16 + "s";
          f.style.setProperty("--dx", Math.random() * 16 - 8 + "vw");
          sky.appendChild(f);
        }
      })();

      /* ===== mute state (shared with the other pages) ===== */
      var muted = false;
      try {
        muted = localStorage.getItem("christmasMuted") === "1";
      } catch (e) {}
      var muteBtn = document.getElementById("mute");
      function showMute() {
        muteBtn.textContent = muted ? "🔇" : "🔊";
        muteBtn.classList.toggle("off", muted);
        muteBtn.setAttribute(
          "aria-label",
          muted ? "Unmute music" : "Mute music",
        );
      }
      showMute();

      /* ===== audio: a playful "snowball" tune in C major (original) ===== */
      var ctx = null,
        master = null,
        sfxGain = null,
        timer = null,
        started = false;
      var events = [],
        evIndex = 0,
        loopStart = 0,
        beat = 60 / TEMPO_BPM,
        LOOP_BEATS = 32;
      function hz(m) {
        return 440 * Math.pow(2, (m - 69) / 12);
      }

      (function buildSong() {
        // C Am F G | C Am F G
        var roots = [48, 45, 41, 43, 48, 45, 41, 43];
        var chords = [
          [60, 64, 67],
          [57, 60, 64],
          [57, 60, 65],
          [59, 62, 67],
          [60, 64, 67],
          [57, 60, 64],
          [57, 60, 65],
          [59, 62, 67],
        ];
        for (var b = 0; b < 8; b++) {
          var t = b * 4;
          events.push({ t: t, m: [roots[b]], d: 0.9, v: 0.6, w: "sine" });
          events.push({
            t: t + 2,
            m: [roots[b] + 7],
            d: 0.9,
            v: 0.5,
            w: "sine",
          });
          events.push({
            t: t + 1,
            m: chords[b],
            d: 0.4,
            v: 0.15,
            w: "triangle",
          });
          events.push({
            t: t + 3,
            m: chords[b],
            d: 0.4,
            v: 0.15,
            w: "triangle",
          });
        }
        var mel = [
          [0, 72, 0.5],
          [0.5, 76, 0.5],
          [1, 79, 1],
          [2, 76, 0.5],
          [2.5, 72, 0.5],
          [3, 76, 1],
          [4, 81, 0.5],
          [4.5, 79, 0.5],
          [5, 76, 1],
          [6, 72, 1],
          [7, 69, 1],
          [8, 77, 0.5],
          [8.5, 81, 0.5],
          [9, 84, 1],
          [10, 81, 0.5],
          [10.5, 77, 0.5],
          [11, 81, 1],
          [12, 79, 1],
          [13, 74, 1],
          [14, 71, 2],
          [16, 72, 0.5],
          [16.5, 76, 0.5],
          [17, 79, 1],
          [18, 84, 1],
          [19, 79, 1],
          [20, 81, 0.5],
          [20.5, 84, 0.5],
          [21, 88, 1],
          [22, 84, 0.5],
          [22.5, 81, 0.5],
          [23, 76, 1],
          [24, 77, 1],
          [25, 81, 0.5],
          [25.5, 77, 0.5],
          [26, 74, 1],
          [27, 77, 1],
          [28, 79, 1],
          [29, 74, 1],
          [30, 72, 2],
        ];
        mel.forEach(function (n) {
          events.push({
            t: n[0],
            m: [n[1]],
            d: n[2] * 0.9,
            v: 0.4,
            w: "triangle",
            pluck: true,
            bell: true,
          });
        });
        events.sort(function (a, b) {
          return a.t - b.t;
        });
      })();

      function playNote(freq, when, durBeats, vol, wave, pluck, bell) {
        var dur = durBeats * beat;
        var o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = wave;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(vol, when + 0.012);
        g.gain.exponentialRampToValueAtTime(
          0.0001,
          when + dur + (pluck ? 0.18 : 0.25),
        );
        o.connect(g);
        g.connect(master);
        o.start(when);
        o.stop(when + dur + 0.4);
        if (bell) {
          var o2 = ctx.createOscillator(),
            g2 = ctx.createGain();
          o2.type = "sine";
          o2.frequency.value = freq * 2;
          g2.gain.setValueAtTime(0.0001, when);
          g2.gain.linearRampToValueAtTime(vol * 0.25, when + 0.01);
          g2.gain.exponentialRampToValueAtTime(0.0001, when + dur * 0.6 + 0.2);
          o2.connect(g2);
          g2.connect(master);
          o2.start(when);
          o2.stop(when + dur + 0.3);
        }
      }
      function schedule() {
        if (!ctx) return;
        while (true) {
          var e = events[evIndex];
          var when = loopStart + e.t * beat;
          if (when > ctx.currentTime + 0.5) break;
          if (when >= ctx.currentTime - 0.05) {
            for (var i = 0; i < e.m.length; i++)
              playNote(hz(e.m[i]), when, e.d, e.v, e.w, e.pluck, e.bell);
          }
          evIndex++;
          if (evIndex >= events.length) {
            evIndex = 0;
            loopStart += LOOP_BEATS * beat;
          }
        }
      }
      function startMusic() {
        if (started) {
          if (ctx && ctx.state === "suspended") ctx.resume();
          return;
        }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : MUSIC_VOLUME;
        master.connect(ctx.destination);
        sfxGain = ctx.createGain();
        sfxGain.gain.value = muted ? 0 : SFX_VOLUME;
        sfxGain.connect(ctx.destination);
        loopStart = ctx.currentTime + 0.2;
        evIndex = 0;
        timer = setInterval(schedule, 100);
        started = true;
        if (ctx.state === "suspended") ctx.resume();
      }
      /* music starts on the first tap anywhere (browsers need a tap) */
      function firstTap() {
        document.removeEventListener("click", firstTap, true);
        document.removeEventListener("touchend", firstTap, true);
        if (!muted) startMusic();
      }
      document.addEventListener("click", firstTap, true);
      document.addEventListener("touchend", firstTap, true);

      muteBtn.addEventListener("click", function () {
        muted = !muted;
        try {
          localStorage.setItem("christmasMuted", muted ? "1" : "0");
        } catch (e) {}
        showMute();
        if (!muted && !started) startMusic();
        if (ctx) {
          master.gain.setTargetAtTime(
            muted ? 0 : MUSIC_VOLUME,
            ctx.currentTime,
            0.05,
          );
          sfxGain.gain.setTargetAtTime(
            muted ? 0 : SFX_VOLUME,
            ctx.currentTime,
            0.05,
          );
        }
      });
      document.addEventListener("visibilitychange", function () {
        if (document.hidden && window.speechSynthesis) speechSynthesis.cancel();
        if (!ctx) return;
        if (document.hidden) ctx.suspend();
        else ctx.resume();
      });

      function blip(freq, delay, dur, type) {
        if (!ctx || muted) return;
        var t = ctx.currentTime + (delay || 0);
        var o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = type || "sine";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(1, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(sfxGain);
        o.start(t);
        o.stop(t + dur + 0.05);
      }
      function sfxFlip() {
        blip(620, 0, 0.07, "triangle");
      }
      function sfxMatch() {
        blip(1047, 0, 0.18, "triangle");
        blip(1568, 0.1, 0.3, "triangle");
      }
      function sfxWrong() {
        blip(260, 0, 0.18, "sine");
        blip(200, 0.12, 0.22, "sine");
      }
      function sfxWin() {
        [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) {
          blip(f, i * 0.14, 0.3, "triangle");
        });
      }

      /* say a word out loud (the device's built-in voice) */
      function say(text) {
        if (!SAY_WORDS || muted || !window.speechSynthesis) return;
        try {
          speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = "en-US";
          u.rate = VOICE_RATE;
          u.pitch = 1.05;
          speechSynthesis.speak(u);
        } catch (e) {}
      }

      /* ===== screens / navigation ===== */
      var screens = { mode: "modeScreen", level: "levelScreen", game: "game" };
      var current = "mode";
      function show(name) {
        current = name;
        for (var k in screens)
          document
            .getElementById(screens[k])
            .classList.toggle("active", k === name);
        document.getElementById("win").classList.remove("show");
        clearConfetti();
        if (window.speechSynthesis) speechSynthesis.cancel();
      }
      var mode = "easy",
        level = 1;

      function goModes() {
        show("mode");
      }
      function goLevels() {
        document.getElementById("levelSub").textContent =
          mode === "easy"
            ? "Easy: match the pictures"
            : "Difficult: match picture + word";
        show("level");
      }
      document.getElementById("back").addEventListener("click", function () {
        if (current === "game") goLevels();
        else if (current === "level") goModes();
        else location.href = "index.html";
      });
      document.getElementById("btnEasy").addEventListener("click", function () {
        mode = "easy";
        goLevels();
      });
      document.getElementById("btnHard").addEventListener("click", function () {
        mode = "hard";
        goLevels();
      });
      Array.prototype.forEach.call(
        document.querySelectorAll("[data-level]"),
        function (b) {
          b.addEventListener("click", function () {
            startGame(parseInt(b.getAttribute("data-level"), 10));
          });
        },
      );
      document
        .getElementById("btnAgain")
        .addEventListener("click", function () {
          startGame(level);
        });
      document.getElementById("btnNext").addEventListener("click", function () {
        startGame(level + 1);
      });
      document.getElementById("btnLevels").addEventListener("click", goLevels);

      /* ===== game ===== */
      var grid = document.getElementById("grid");
      var deck = [],
        first = null,
        second = null,
        lock = false,
        moves = 0,
        found = 0,
        totalPairs = 0;

      function shuffle(a) {
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function startGame(lv) {
        level = lv;
        totalPairs = LEVEL_PAIRS[lv];
        var picked = shuffle(ITEMS.slice()).slice(0, totalPairs);
        deck = [];
        picked.forEach(function (it) {
          deck.push({ name: it[0], file: it[1], type: "pic" });
          deck.push({
            name: it[0],
            file: it[1],
            type: mode === "easy" ? "pic" : "word",
          });
        });
        shuffle(deck);
        first = second = null;
        lock = false;
        moves = 0;
        found = 0;
        updateHud();
        show("game");
        render();
        layout();
      }

      function updateHud() {
        document.getElementById("hudLevel").textContent = "Level " + level;
        document.getElementById("hudPairs").textContent =
          "Pairs " + found + "/" + totalPairs;
        document.getElementById("hudMoves").textContent = "Moves " + moves;
        document.getElementById("progFill").style.width =
          (found / totalPairs) * 100 + "%";
      }

      function render() {
        grid.innerHTML = "";
        deck.forEach(function (c, i) {
          var el = document.createElement("div");
          el.className = "card k" + (i % 5);
          var inner =
            '<div class="inner"><div class="side cover"></div><div class="side face">';
          if (c.type === "word") inner += '<div class="txt"></div>';
          else inner += '<img alt="">';
          inner += "</div></div>";
          el.innerHTML = inner;
          if (c.type === "word") el.querySelector(".txt").textContent = c.name;
          else {
            var im = el.querySelector("img");
            im.onerror = function () {
              var d = document.createElement("div");
              d.className = "txt";
              d.textContent = c.name;
              im.parentNode.replaceChild(d, im);
            };
            im.src = IMG_FOLDER + c.file;
          }
          el.addEventListener("click", function () {
            flip(i, el);
          });
          c.el = el;
          grid.appendChild(el);
        });
      }

      function flip(i, el) {
        if (lock || el.classList.contains("flipped")) return;
        el.classList.add("flipped");
        sfxFlip();
        if (first === null) {
          first = i;
          return;
        }
        second = i;
        lock = true;
        moves++;
        updateHud();
        var a = deck[first],
          b = deck[second];
        if (a.name === b.name) {
          setTimeout(function () {
            a.el.classList.add("matched");
            b.el.classList.add("matched");
            sfxMatch();
            found++;
            updateHud();
            first = second = null;
            lock = false;
            if (found === totalPairs) setTimeout(win, 700);
            else say(a.name);
          }, 450);
        } else {
          setTimeout(function () {
            a.el.classList.add("wrong");
            b.el.classList.add("wrong");
            sfxWrong();
          }, 420);
          setTimeout(function () {
            a.el.classList.remove("flipped", "wrong");
            b.el.classList.remove("flipped", "wrong");
            first = second = null;
            lock = false;
          }, FLIP_BACK_MS + 350);
        }
      }

      /* fit the cards to the screen */
      function layout() {
        var board = document.getElementById("board");
        var w = board.clientWidth,
          h = board.clientHeight,
          n = deck.length;
        if (!n || !w || !h) return;
        var gap = n > 20 ? 6 : 10,
          best = 0,
          bestCols = 1;
        for (var cols = 1; cols <= n; cols++) {
          var rows = Math.ceil(n / cols);
          var cw = (w - gap * (cols - 1)) / cols;
          var ch = (h - gap * (rows - 1)) / rows;
          var size = Math.min(cw, ch / CARD_RATIO);
          if (size > best) {
            best = size;
            bestCols = cols;
          }
        }
        best = Math.floor(best);
        grid.style.gap = gap + "px";
        grid.style.gridTemplateColumns =
          "repeat(" + bestCols + "," + best + "px)";
        grid.style.gridAutoRows = Math.floor(best * CARD_RATIO) + "px";
        grid.style.setProperty("--cw", best + "px");
      }
      window.addEventListener("resize", layout);
      window.addEventListener("orientationchange", function () {
        setTimeout(layout, 250);
      });

      /* ===== win ===== */
      function win() {
        sfxWin();
        var ratio = moves / totalPairs,
          stars = ratio <= 1.6 ? 3 : ratio <= 2.4 ? 2 : 1,
          s = "";
        for (var i = 0; i < 3; i++) s += i < stars ? "⭐" : "☆";
        document.getElementById("winStars").textContent = s;
        document.getElementById("winText").textContent =
          "You matched all " + totalPairs + " pairs in " + moves + " moves!";
        document.getElementById("btnNext").style.display =
          level < 3 ? "" : "none";
        document.getElementById("win").classList.add("show");
        confetti();
      }
      function confetti() {
        var box = document.getElementById("win"),
          em = ["🎄", "⭐", "🎁", "❄️", "🔔", "🍬"];
        for (var i = 0; i < 28; i++) {
          var s = document.createElement("div");
          s.className = "fall";
          s.textContent = em[i % em.length];
          s.style.left = Math.random() * 100 + "vw";
          s.style.animationDuration = 3 + Math.random() * 3 + "s";
          s.style.animationDelay = Math.random() * 2 + "s";
          box.appendChild(s);
        }
      }
      function clearConfetti() {
        Array.prototype.forEach.call(
          document.querySelectorAll(".fall"),
          function (n) {
            n.remove();
          },
        );
      }

      /* preload images quietly */
      ITEMS.forEach(function (it) {
        var im = new Image();
        im.src = IMG_FOLDER + it[1];
      });
      /* ===== audio keep-alive ===== */
      try {
        if (navigator.audioSession) navigator.audioSession.type = "playback";
      } catch (e) {}
      function wakeAudio() {
        if (ctx && !muted && !document.hidden && ctx.state !== "running") {
          var p = ctx.resume();
          if (p && p.catch) p.catch(function () {});
        }
      }
      setInterval(wakeAudio, 1000);
      ["touchend", "click"].forEach(function (ev) {
        document.addEventListener(ev, wakeAudio, true);
      });
    </script>
  </body>
</html>
