<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sentence Builder</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b2f3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Christmas" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="images/Cicon.jpg" />
    <link rel="icon" type="image/jpeg" href="images/Cicon.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Mountains+of+Christmas:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg1: #07222b;
        --bg2: #0e4150;
        --bg3: #1b6b6f;
        --red: #d7263d;
        --bad: #ff4d5e;
        --gold: #ffcf4a;
        --cream: #fffaf0;
        --green: #4ade80;
        --font:
          "Fredoka", "Chalkboard SE", "Hiragino Maru Gothic ProN",
          "Comic Sans MS", system-ui, sans-serif;
        --title:
          "Mountains of Christmas", "Fredoka", "Hiragino Maru Gothic ProN",
          cursive, system-ui, sans-serif;
        --top: calc(env(safe-area-inset-top, 0px) + 88px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg1);
        font-family: var(--font);
        color: var(--cream);
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      body {
        background:
          radial-gradient(
            ellipse at 15% 0%,
            rgba(80, 220, 160, 0.28),
            transparent 45%
          ),
          radial-gradient(
            ellipse at 90% 10%,
            rgba(215, 38, 61, 0.22),
            transparent 40%
          ),
          linear-gradient(
            180deg,
            var(--bg1) 0%,
            var(--bg2) 60%,
            var(--bg3) 100%
          );
      }

      /* ---------- decorations ---------- */
      #lights {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(env(safe-area-inset-top, 0px) + 30px);
        z-index: 3;
        pointer-events: none;
      }
      .bulb {
        position: absolute;
        width: 10px;
        height: 15px;
        border-radius: 50% 50% 55% 55%;
        background: var(--c);
        box-shadow: 0 0 10px 3px var(--c);
        animation: glow 1.8s infinite ease-in-out;
      }
      .bulb::before {
        content: "";
        position: absolute;
        left: 2px;
        top: -4px;
        width: 6px;
        height: 5px;
        background: #2b3a3f;
        border-radius: 2px;
      }
      @keyframes glow {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }
      .flake {
        position: fixed;
        top: -10px;
        border-radius: 50%;
        background: #fff;
        z-index: 0;
        pointer-events: none;
        animation: snowfall linear infinite;
      }
      @keyframes snowfall {
        from {
          transform: translate(0, -5vh);
        }
        to {
          transform: translate(var(--dx), 108vh);
        }
      }

      /* ---------- top buttons ---------- */
      .round {
        position: fixed;
        z-index: 30;
        top: calc(env(safe-area-inset-top, 0px) + 32px);
        width: clamp(44px, 7.6vmin, 58px);
        height: clamp(44px, 7.6vmin, 58px);
        border-radius: 50%;
        border: 3px solid #fff;
        background: var(--red);
        font-size: clamp(22px, 4.2vmin, 32px);
        cursor: pointer;
        color: #fff;
        font-family: var(--font);
        font-weight: 700;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .round:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      #back {
        left: calc(env(safe-area-inset-left, 0px) + 12px);
      }
      #mute {
        right: calc(env(safe-area-inset-right, 0px) + 12px);
      }
      #mute.off {
        background: #5d7078;
      }

      /* ---------- screens ---------- */
      .screen {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--top) calc(env(safe-area-inset-right, 0px) + 14px)
          calc(env(safe-area-inset-bottom, 0px) + 12px)
          calc(env(safe-area-inset-left, 0px) + 14px);
        gap: 3vmin;
        text-align: center;
      }
      .screen.active {
        display: flex;
      }
      h1 {
        font-family: var(--title);
        font-size: clamp(34px, 9vmin, 72px);
        line-height: 1.05;
        color: #fff;
        font-weight: 700;
        text-shadow:
          0 4px 0 var(--red),
          0 0 26px rgba(255, 207, 74, 0.55);
      }
      .sub {
        font-size: clamp(15px, 3.2vmin, 26px);
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #5a1a00;
        background: var(--gold);
        padding: 0.1em 0.9em;
        border-radius: 40px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
      }
      .choices {
        display: flex;
        gap: clamp(12px, 3vmin, 28px);
        flex-wrap: wrap;
        justify-content: center;
        width: min(94vw, 900px);
      }
      .big {
        font-family: var(--font);
        color: #fff;
        cursor: pointer;
        border: 4px solid rgba(255, 255, 255, 0.9);
        border-radius: clamp(18px, 3.6vmin, 30px);
        padding: clamp(12px, 2.4vmin, 24px) clamp(18px, 4vmin, 40px);
        min-width: clamp(150px, 30vmin, 260px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6vmin;
        box-shadow:
          0 8px 0 rgba(0, 0, 0, 0.35),
          0 14px 26px rgba(0, 0, 0, 0.3);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .big:active {
        transform: translateY(6px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .big b {
        font-size: clamp(24px, 5.2vmin, 44px);
        font-weight: 700;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .big small {
        font-size: clamp(13px, 2.6vmin, 21px);
        font-weight: 500;
        opacity: 0.95;
      }
      .big .pic {
        height: clamp(40px, 10vmin, 80px);
        width: auto;
        filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.35));
      }
      .easy {
        background: linear-gradient(160deg, #38c172, #14753a);
      }
      .hard {
        background: linear-gradient(160deg, #ff5a6e, #b81830);
      }
      .blue {
        background: linear-gradient(160deg, #5bc0f8, #1b73c4);
      }
      .alt {
        background: linear-gradient(160deg, #ffc83d, #e08a00);
      }

      /* ---------- game ---------- */
      #game {
        justify-content: flex-start;
        gap: 1.2vmin;
        padding-top: calc(var(--top) - 14px);
      }
      #hud {
        display: flex;
        gap: clamp(8px, 2.4vmin, 26px);
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        font-size: clamp(15px, 3.2vmin, 26px);
        font-weight: 700;
        color: var(--gold);
        flex: none;
      }
      #hud span {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 30px;
        padding: 3px 16px;
        white-space: nowrap;
      }
      #prog {
        flex: none;
        width: min(80vw, 520px);
        height: clamp(10px, 1.8vmin, 16px);
        border-radius: 20px;
        border: 2px solid #fff;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #progFill {
        display: block;
        height: 100%;
        width: 0;
        background: repeating-linear-gradient(
          -45deg,
          var(--red) 0 8px,
          #fff 8px 16px
        );
        transition: width 0.4s;
      }

      /* the game card has a candy-cane border */
      #bCard {
        flex: 1;
        min-height: 0;
        width: min(96vw, 860px);
        display: flex;
        flex-direction: column;
        gap: 1.2vmin;
        padding: clamp(8px, 2vmin, 18px);
        border: 6px solid transparent;
        border-radius: 28px;
        background:
          linear-gradient(#0a3340, #0a3340) padding-box,
          repeating-linear-gradient(45deg, var(--red) 0 12px, #fff 12px 24px)
            border-box;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      #bPicBox {
        flex: 1 1 0;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      #bPic {
        max-width: 90%;
        max-height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.4));
        animation: pop 0.4s;
      }
      @keyframes pop {
        0% {
          transform: scale(0.7);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      #bSay {
        display: none;
        position: absolute;
        right: 2px;
        bottom: 2px;
        width: clamp(44px, 8vmin, 60px);
        height: clamp(44px, 8vmin, 60px);
        border-radius: 50%;
        border: 3px solid #fff;
        background: linear-gradient(160deg, #5bc0f8, #1b73c4);
        font-size: clamp(20px, 4vmin, 30px);
        cursor: pointer;
        color: #fff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
      }
      #bSay:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      #bCtl {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: clamp(6px, 1.4vmin, 12px);
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #inst {
        font-size: clamp(14px, 3vmin, 24px);
        color: var(--gold);
        font-weight: 700;
      }

      /* where the sentence is built */
      #zone {
        display: flex;
        flex-wrap: wrap;
        gap: clamp(6px, 1.4vmin, 10px);
        align-items: center;
        align-content: flex-start;
        justify-content: center;
        min-height: clamp(64px, 12vmin, 100px);
        padding: clamp(6px, 1.4vmin, 12px);
        border: 4px dashed var(--gold);
        border-radius: 18px;
        background: var(--cream);
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      #zone.over {
        border-color: #fff;
        background: #fff3d1;
      }
      #zone.correct {
        border: 4px solid var(--green);
        background: #e8ffe8;
      }
      #zone.wrong {
        border-color: var(--bad);
        background: #ffe9e9;
        animation: shake 0.4s;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }
      #ph {
        color: #7a8f96;
        font-size: clamp(14px, 3vmin, 22px);
        font-style: italic;
        font-weight: 500;
      }

      /* word bank */
      #bank {
        display: flex;
        flex-wrap: wrap;
        gap: clamp(6px, 1.4vmin, 10px);
        justify-content: center;
        align-content: flex-start;
        min-height: clamp(56px, 10vmin, 84px);
        padding: clamp(6px, 1.4vmin, 10px);
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.22);
      }

      /* the word chips: little baubles in Christmas colours */
      .chip {
        touch-action: none;
        font-family: var(--font);
        font-weight: 700;
        font-size: clamp(18px, 4.2vmin, 32px);
        line-height: 1.2;
        color: #fff;
        padding: 0.22em 0.7em;
        border-radius: 14px;
        border: 3px solid #fff;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        cursor: grab;
        white-space: nowrap;
        flex-shrink: 0;
        animation: pop 0.3s backwards;
      }
      .chip.k0 {
        background: linear-gradient(160deg, #ff5a6e, #b81830);
      }
      .chip.k1 {
        background: linear-gradient(160deg, #38c172, #14753a);
      }
      .chip.k2 {
        background: linear-gradient(160deg, #5bc0f8, #1b73c4);
      }
      .chip.k3 {
        background: linear-gradient(160deg, #b57bff, #6b32c9);
      }
      .chip.k4 {
        background: linear-gradient(160deg, #ffc83d, #e08a00);
      }
      .chip.lift {
        opacity: 0.25;
      }
      .chip.ghost {
        position: fixed;
        z-index: 60;
        pointer-events: none;
        animation: none;
        transform: scale(1.08) rotate(-2deg);
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.4);
      }
      .chip.ok {
        outline: 4px solid var(--green);
      }
      .chip.bad {
        outline: 4px solid var(--bad);
      }
      .chip.locked {
        cursor: default;
      }

      #fb {
        min-height: 1.4em;
        font-size: clamp(15px, 3.3vmin, 26px);
        font-weight: 700;
      }
      #fb.good {
        color: var(--green);
      }
      #fb.bad {
        color: var(--gold);
      }

      .btns {
        display: flex;
        gap: clamp(8px, 2vmin, 16px);
        justify-content: center;
        flex-wrap: wrap;
      }
      .act {
        font-family: var(--font);
        font-weight: 700;
        font-size: clamp(18px, 3.8vmin, 28px);
        color: #fff;
        cursor: pointer;
        padding: 0.3em 1.1em;
        border-radius: 50px;
        border: 4px solid #fff;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
      }
      .act:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      .act.grey {
        background: linear-gradient(160deg, #8a97a0, #55646d);
      }
      .act.green {
        background: linear-gradient(160deg, #38c172, #14753a);
      }
      .act.blue {
        background: linear-gradient(160deg, #5bc0f8, #1b73c4);
      }
      /* landscape: picture on the left, the sentence on the right */
      @media (orientation: landscape) {
        #bCard {
          flex-direction: row;
          gap: 2vw;
        }
        #bPicBox {
          flex: 0.7 1 0;
          height: 100%;
        }
        #bCtl {
          flex: 1.4 1 0;
          justify-content: center;
          height: 100%;
        }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        .screen {
          gap: 1.6vh;
        }
        h1 {
          font-size: clamp(24px, 10vh, 50px);
        }
        .sub {
          font-size: clamp(13px, 5vh, 22px);
        }
        #hud {
          font-size: clamp(13px, 4.4vh, 20px);
        }
        .chip {
          font-size: clamp(15px, 5.4vh, 24px);
        }
        #zone {
          min-height: clamp(48px, 15vh, 70px);
        }
        #bank {
          min-height: clamp(44px, 14vh, 64px);
        }
        .act {
          font-size: clamp(15px, 5vh, 22px);
        }
      }

      /* ---------- results ---------- */
      #result {
        justify-content: flex-start;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        gap: 2vmin;
        padding-bottom: 30px;
      }
      #result h1 {
        margin-top: auto;
      }
      .stars {
        font-size: clamp(34px, 8vmin, 64px);
        letter-spacing: 6px;
      }
      .stats {
        display: flex;
        gap: clamp(10px, 3vmin, 30px);
        flex-wrap: wrap;
        justify-content: center;
      }
      .stat {
        background: rgba(0, 0, 0, 0.32);
        border-radius: 24px;
        padding: clamp(8px, 1.6vmin, 16px) clamp(18px, 4vmin, 40px);
        min-width: clamp(120px, 26vmin, 220px);
      }
      .stat small {
        display: block;
        font-size: clamp(13px, 2.6vmin, 20px);
        color: var(--gold);
        font-weight: 500;
      }
      .stat b {
        font-size: clamp(28px, 7vmin, 56px);
        font-weight: 700;
      }
      #missTitle {
        font-size: clamp(18px, 4vmin, 30px);
        color: var(--gold);
        font-weight: 700;
      }
      #missList {
        display: grid;
        grid-template-columns: repeat(
          auto-fill,
          minmax(clamp(150px, 30vmin, 230px), 1fr)
        );
        gap: 12px;
        width: min(96vw, 900px);
      }
      .missCard {
        background: var(--cream);
        border-radius: 20px;
        border: 3px solid var(--gold);
        padding: 8px 8px 10px;
        color: #0f4a2c;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .missCard img {
        width: 60%;
        height: clamp(50px, 11vmin, 90px);
        object-fit: contain;
      }
      .missCard .w {
        font-size: clamp(14px, 2.8vmin, 20px);
        font-weight: 700;
        line-height: 1.2;
      }
      #perfect {
        font-size: clamp(20px, 4.6vmin, 34px);
        color: var(--green);
        font-weight: 700;
      }
      #result .choices {
        margin-top: 1vmin;
        margin-bottom: auto;
      }
      #result .choices .big {
        min-width: clamp(130px, 24vmin, 210px);
        padding: clamp(10px, 2vmin, 18px) clamp(14px, 3vmin, 30px);
      }
      .fall {
        position: absolute;
        top: -60px;
        font-size: clamp(24px, 5vmin, 44px);
        animation: confall linear forwards;
        pointer-events: none;
        z-index: 5;
      }
      @keyframes confall {
        to {
          transform: translateY(115vh) rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="lights"></div>
    <div id="sky"></div>

    <button id="back" class="round" aria-label="Back">&#8592;</button>
    <button
      id="mute"
      class="round"
      aria-label="Mute music"
      title="Music on/off"
    >
      🔊
    </button>

    <!-- screen 1: mode -->
    <section id="modeScreen" class="screen active">
      <h1>Sentence Builder</h1>
      <div class="sub">Put the words in the right order</div>
      <div class="choices">
        <button class="big easy" id="btnEasy">
          <img class="pic" src="images/snowman.png" alt="" />
          <b>Easy</b><small>Short sentences</small>
        </button>
        <button class="big hard" id="btnHard">
          <img class="pic" src="images/sleigh.png" alt="" />
          <b>Difficult</b><small>Longer sentences</small>
        </button>
      </div>
    </section>

    <!-- screen 2: game -->
    <section id="game" class="screen">
      <div id="hud">
        <span id="hudQ">Sentence 1/10</span><span id="hudScore">⭐ 0</span
        ><span id="hudTime">⏱ 0:00</span>
      </div>
      <div id="prog"><i id="progFill"></i></div>
      <div id="bCard">
        <div id="bPicBox">
          <img id="bPic" alt="" />
          <button id="bSay" aria-label="Hear the sentence">🔊</button>
        </div>
        <div id="bCtl">
          <div id="inst">Tap or drag the words to build the sentence</div>
          <div id="zone">
            <span id="ph">Put the words here...</span>
          </div>
          <div id="bank"></div>
          <div id="fb"></div>
          <div class="btns">
            <button class="act grey" id="reset">↺ Reset</button>
            <button class="act green" id="check">✓ Check</button>
            <button class="act blue" id="next" style="display: none">
              Next ▶
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- screen 3: results -->
    <section id="result" class="screen">
      <h1 id="resTitle">Great job!</h1>
      <div class="stars" id="resStars"></div>
      <div class="stats">
        <div class="stat"><small>Score</small><b id="resScore">0/10</b></div>
        <div class="stat"><small>Time</small><b id="resTime">0:00</b></div>
      </div>
      <div id="missTitle"></div>
      <div id="perfect" style="display: none">
        Every sentence right first time! 🎄
      </div>
      <div id="missList"></div>
      <div class="choices">
        <button class="big alt" id="btnAgain"><b>Play again</b></button>
        <button class="big blue" id="btnModes"><b>Modes</b></button>
      </div>
    </section>

    <script>
      /* ===== settings ===== */
      var MUSIC_VOLUME = 0.1; // background music level (0 to 1)
      var SFX_VOLUME = 0.25; // jingle level
      var TEMPO_BPM = 138;
      var VOICE_RATE = 0.85; // speaking speed (lower = slower)
      var SENTENCES_PER_GAME = 10; // how many sentences are drawn each game
      var IMG_FOLDER = "images/";

      /* image file, sentence. Put a SPACE before every ? . ! so they become their own word chip. */
      var EASY = [
        ["santa.png", "I see Santa ."],
        ["reindeer.png", "The reindeer is brown ."],
        ["sleigh.png", "Look at the sleigh !"],
        ["elf.png", "The elf is small ."],
        ["snowman.png", "I made a snowman ."],
        ["snowflake.png", "I see a snowflake ."],
        ["tree.png", "I like the Christmas tree ."],
        ["star.png", "The star is yellow ."],
        ["decoration.png", "I like the decoration ."],
        ["present.png", "I got a present ."],
        ["wrapping-paper.png", "I need wrapping paper ."],

        $("resStars").textContent = s;

        var list = $("missList");
        list.innerHTML = "";
        if (missed.length) {
          $("missTitle").textContent = "Sentences to practise:";
          $("perfect").style.display = "none";
          missed.forEach(function (q) {
            var c = document.createElement("div");
            c.className = "missCard";
            var im = document.createElement("img");
            im.alt = "";
            im.src = IMG_FOLDER + q[0];
            im.onerror = function () {
              im.style.visibility = "hidden";
            };
            var t = document.createElement("div");
            t.className = "w";
            t.textContent = pretty(q[1]);
            c.appendChild(im);
            c.appendChild(t);
            list.appendChild(c);
          });
        } else {
          $("missTitle").textContent = "";
          $("perfect").style.display = "block";
        }
        show("result");
        $("result").scrollTop = 0;
        jingleWin();
        confetti();
      }
      function confetti() {
        var box = $("result"),
          em = ["🎄", "⭐", "🎁", "❄️", "🔔", "🍬"];
        for (var i = 0; i < 24; i++) {
          var s = document.createElement("div");
          s.className = "fall";
          s.textContent = em[i % em.length];
          s.style.left = Math.random() * 100 + "%";
          s.style.animationDuration = 3 + Math.random() * 3 + "s";
          s.style.animationDelay = Math.random() * 2 + "s";
          box.appendChild(s);
        }
      }
      function clearConfetti() {
        Array.prototype.forEach.call(
          document.querySelectorAll(".fall"),
          function (n) {
            n.remove();
          },
        );
      }

      /* preload images quietly */
      EASY.forEach(function (q) {
        var im = new Image();
        im.src = IMG_FOLDER + q[0];
      });
    </script>
  </body>
</html>
