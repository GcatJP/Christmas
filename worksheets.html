<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Worksheets</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b2f3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Christmas" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="images/icon.png" />
    <link rel="icon" type="image/png" href="images/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Mountains+of+Christmas:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg1: #07222b;
        --bg2: #0e4150;
        --bg3: #1b6b6f;
        --red: #d7263d;
        --gold: #ffcf4a;
        --cream: #fffaf0;
        --font:
          "Fredoka", "Chalkboard SE", "Hiragino Maru Gothic ProN",
          "Comic Sans MS", system-ui, sans-serif;
        --title:
          "Mountains of Christmas", "Fredoka", "Hiragino Maru Gothic ProN",
          cursive, system-ui, sans-serif;
        --gap: clamp(14px, 2.8vmin, 26px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg1);
        font-family: var(--font);
        color: var(--cream);
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      body {
        background:
          radial-gradient(
            ellipse at 15% 0%,
            rgba(80, 220, 160, 0.28),
            transparent 45%
          ),
          radial-gradient(
            ellipse at 90% 10%,
            rgba(215, 38, 61, 0.22),
            transparent 40%
          ),
          linear-gradient(
            180deg,
            var(--bg1) 0%,
            var(--bg2) 60%,
            var(--bg3) 100%
          );
      }

      /* ---------- decorations ---------- */
      #lights {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(env(safe-area-inset-top, 0px) + 30px);
        z-index: 3;
        pointer-events: none;
      }
      .bulb {
        position: absolute;
        width: 10px;
        height: 15px;
        border-radius: 50% 50% 55% 55%;
        background: var(--c);
        box-shadow: 0 0 10px 3px var(--c);
        animation: glow 1.8s infinite ease-in-out;
      }
      .bulb::before {
        content: "";
        position: absolute;
        left: 2px;
        top: -4px;
        width: 6px;
        height: 5px;
        background: #2b3a3f;
        border-radius: 2px;
      }
      @keyframes glow {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }
      .flake {
        position: fixed;
        top: -10px;
        border-radius: 50%;
        background: #fff;
        z-index: 0;
        pointer-events: none;
        animation: snowfall linear infinite;
      }
      @keyframes snowfall {
        from {
          transform: translate(0, -5vh);
        }
        to {
          transform: translate(var(--dx), 108vh);
        }
      }

      /* ---------- top buttons ---------- */
      .round {
        position: fixed;
        z-index: 30;
        top: calc(env(safe-area-inset-top, 0px) + 32px);
        width: clamp(44px, 7.6vmin, 58px);
        height: clamp(44px, 7.6vmin, 58px);
        border-radius: 50%;
        border: 3px solid #fff;
        background: var(--red);
        font-size: clamp(22px, 4.2vmin, 32px);
        cursor: pointer;
        color: #fff;
        font-family: var(--font);
        font-weight: 700;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .round:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      #back {
        left: calc(env(safe-area-inset-left, 0px) + 12px);
      }
      #mute {
        right: calc(env(safe-area-inset-right, 0px) + 12px);
      }
      #mute.off {
        background: #5d7078;
      }

      /* ---------- page ---------- */
      #app {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 88px)
          calc(env(safe-area-inset-right, 0px) + 14px)
          calc(env(safe-area-inset-bottom, 0px) + 18px)
          calc(env(safe-area-inset-left, 0px) + 14px);
        gap: 2.4vmin;
        text-align: center;
      }
      h1 {
        font-family: var(--title);
        font-size: clamp(34px, 8.6vmin, 70px);
        line-height: 1.05;
        color: #fff;
        font-weight: 700;
        flex: none;
        text-shadow:
          0 4px 0 var(--red),
          0 0 26px rgba(255, 207, 74, 0.55);
      }
      .phrase {
        font-size: clamp(16px, 3.6vmin, 30px);
        font-weight: 700;
        color: var(--gold);
        line-height: 1.3;
        flex: none;
        max-width: min(92vw, 760px);
        padding: clamp(8px, 1.6vmin, 16px) clamp(14px, 3vmin, 30px);
        border: 5px solid transparent;
        border-radius: 26px;
        background:
          linear-gradient(#0a3340, #0a3340) padding-box,
          repeating-linear-gradient(45deg, var(--red) 0 12px, #fff 12px 24px)
            border-box;
      }

      /* portrait: 2 + 2 + 1 (the last present sits in the middle) */
      .menu {
        flex: 1 1 auto;
        min-height: 0;
        max-height: 640px;
        width: min(92vw, 560px);
        display: grid;
        gap: var(--gap);
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        padding-top: 14px;
      }
      a.card {
        --c1: #ff5a6e;
        --c2: #b81830;
        --rib: var(--gold);
        --ink: #8c1226;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 0.8vmin;
        text-decoration: none;
        color: #fff;
        border-radius: clamp(12px, 2.6vmin, 22px);
        min-height: 0;
        height: 100%;
        padding: clamp(6px, 1.6vmin, 16px);
        padding-top: clamp(12px, 3vmin, 26px);
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.26) 0 15%,
            rgba(0, 0, 0, 0.18) 15% 17%,
            transparent 17%
          ),
          linear-gradient(160deg, var(--c1), var(--c2));
        box-shadow:
          0 8px 0 rgba(0, 0, 0, 0.38),
          0 14px 26px rgba(0, 0, 0, 0.4),
          inset 0 0 0 3px rgba(255, 255, 255, 0.28);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      a.card:active {
        transform: translateY(6px);
        box-shadow:
          0 2px 0 rgba(0, 0, 0, 0.38),
          inset 0 0 0 3px rgba(255, 255, 255, 0.28);
      }
      a.card::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 14%;
        transform: translateX(-50%);
        background:
          linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.12),
            rgba(255, 255, 255, 0.35) 50%,
            rgba(0, 0, 0, 0.12)
          ),
          var(--rib);
        z-index: 0;
      }
      a.card::after {
        content: "🎀";
        position: absolute;
        top: calc(-1 * clamp(10px, 2.4vmin, 20px));
        left: 50%;
        transform: translateX(-50%);
        font-size: clamp(22px, 5.4vmin, 44px);
        line-height: 1;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35));
        z-index: 3;
      }
      a.card:nth-child(5) {
        grid-column: 1 / -1;
        justify-self: center;
        width: calc(50% - var(--gap) / 2);
      }
      .card img {
        position: relative;
        z-index: 1;
        width: 72%;
        flex: 1 1 0;
        min-height: 0;
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.4));
        animation: bob 3s ease-in-out infinite;
      }
      .card:nth-child(2) img {
        animation-delay: -1s;
      }
      .card:nth-child(3) img {
        animation-delay: -2s;
      }
      .card:nth-child(4) img {
        animation-delay: -3s;
      }
      .card:nth-child(5) img {
        animation-delay: -4s;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      .card b {
        position: relative;
        z-index: 2;
        flex: none;
        font-size: clamp(15px, 3.2vmin, 26px);
        font-weight: 700;
        line-height: 1.15;
        color: var(--ink);
        background: var(--cream);
        padding: 0.12em 0.8em;
        border-radius: 40px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      }
      .c-z {
        --c1: #ff5a6e;
        --c2: #b81830;
        --rib: #ffcf4a;
        --ink: #a0132a;
      }
      .c-m {
        --c1: #38c172;
        --c2: #14753a;
        --rib: #ffe9a0;
        --ink: #0f5e2f;
      }
      .c-c {
        --c1: #5bc0f8;
        --c2: #1b73c4;
        --rib: #ffffff;
        --ink: #14589a;
      }
      .c-k {
        --c1: #ffc83d;
        --c2: #e08a00;
        --rib: #d7263d;
        --ink: #8a4a00;
      }
      .c-f {
        --c1: #b57bff;
        --c2: #6b32c9;
        --rib: #ffcf4a;
        --ink: #4f2095;
      }

      /* landscape: all five across */
      @media (orientation: landscape) {
        #app {
          padding-top: calc(env(safe-area-inset-top, 0px) + 38px);
          gap: 2vmin;
        }
        h1 {
          font-size: clamp(28px, 10vh, 60px);
        }
        .phrase {
          font-size: clamp(14px, 4.4vh, 28px);
          max-width: calc(100vw - 180px);
        }
        .menu {
          flex: none;
          max-height: none;
          display: flex;
          flex-direction: row;
          width: min(96vw, 1100px);
          padding-top: 12px;
        }
        a.card {
          flex: 1;
          min-width: 0;
          height: min(42vh, 270px);
        }
        a.card:nth-child(5) {
          grid-column: auto;
          justify-self: auto;
          width: auto;
        }
        .card b {
          font-size: clamp(13px, 3.8vh, 22px);
        }
      }
    </style>
  </head>
  <body>
    <div id="lights"></div>
    <div id="sky"></div>

    <button id="back" class="round" aria-label="Back">&#8592;</button>
    <button
      id="mute"
      class="round"
      aria-label="Mute music"
      title="Music on/off"
    >
      🔊
    </button>

    <main id="app">
      <h1>Worksheets</h1>
      <div class="phrase">
        Here are some Christmas worksheets for you to print out and enjoy!
      </div>
      <nav class="menu">
        <a class="card c-z" id="w1" target="_blank" rel="noopener"
          ><img src="images/snowman.png" alt="" /><b>Worksheets 1</b></a
        >
        <a class="card c-m" id="w2" target="_blank" rel="noopener"
          ><img src="images/stocking.png" alt="" /><b>Worksheets 2</b></a
        >
        <a class="card c-c" id="w3" target="_blank" rel="noopener"
          ><img src="images/christmas-card.png" alt="" /><b>Reading</b></a
        >
        <a class="card c-k" id="w4" target="_blank" rel="noopener"
          ><img src="images/candy-cane.png" alt="" /><b>Coloring</b></a
        >
        <a class="card c-f" id="w5" target="_blank" rel="noopener"
          ><img src="images/bell.png" alt="" /><b>Cards and Bingo</b></a
        >
      </nav>
    </main>

    <script>
      /* ===== where the PDFs are =====
         Same folder as the app:    PDF_BASE = "pdfs/";
         bunny.net (Pull Zone URL): PDF_BASE = "https://YOUR-ZONE.b-cdn.net/christmas_pdfs/";
         Then put each file name below (w1 = Worksheets 1, w2 = Worksheets 2,
         w3 = Reading, w4 = Coloring, w5 = Flashcards).
         To use a full web address for one button, just paste the whole URL
         as the file name and it will be used as it is. */
      var PDF_BASE = "https://adventureislandesl.b-cdn.net/Christmas_PDFs/";
      var PDF_FILES = {
        w1: "Christmas_Worksheets_1.pdf",
        w2: "Christmas__Worksheets_2.pdf",
        w3: "Christmas_Reading.pdf",
        w4: "Christmas_Coloring.pdf",
        w5: "Chritsmas_Cards.pdf",
      };
      /* the "/" between the folder and the file name is added for you,
         so it does not matter if PDF_BASE ends with one or not */
      var BASE = PDF_BASE.replace(/\/+$/, "") + "/";
      Object.keys(PDF_FILES).forEach(function (id) {
        var f = PDF_FILES[id];
        document.getElementById(id).href = /^https?:\/\//i.test(f)
          ? f
          : BASE + f;
      });
      /* hide an icon quietly if its image file is missing */
      Array.prototype.forEach.call(
        document.querySelectorAll(".card img"),
        function (im) {
          im.onerror = function () {
            im.style.visibility = "hidden";
          };
        },
      );

      /* ===== settings ===== */
      var MUSIC_VOLUME = 0.1; // background music level (0 to 1)
      var SFX_VOLUME = 0.25; // button sound level
      var TEMPO_BPM = 112;

      /* ===== twinkling string lights ===== */
      var LIGHT_COLORS = [
        "#ff4d5e",
        "#ffd54a",
        "#4ade80",
        "#5bc0f8",
        "#ff9ad5",
      ];
      function buildLights() {
        var box = document.getElementById("lights");
        box.innerHTML = "";
        var inset = parseFloat(getComputedStyle(box).height) - 30 || 0;
        var gap = 32;
        var n = Math.ceil(window.innerWidth / gap) + 1;
        for (var i = 0; i < n; i++) {
          var b = document.createElement("div");
          b.className = "bulb";
          var sag = Math.sin((Math.PI * (i % 6)) / 6) * 8;
          b.style.left = i * gap + 4 + "px";
          b.style.top = inset + 5 + sag + "px";
          b.style.setProperty("--c", LIGHT_COLORS[i % LIGHT_COLORS.length]);
          b.style.animationDelay = -((i * 0.37) % 1.8) + "s";
          box.appendChild(b);
        }
      }
      buildLights();
      window.addEventListener("resize", buildLights);

      /* ===== snowfall ===== */
      (function () {
        var sky = document.getElementById("sky");
        for (var i = 0; i < 40; i++) {
          var f = document.createElement("div");
          f.className = "flake";
          var s = 3 + Math.random() * 6;
          f.style.width = s + "px";
          f.style.height = s + "px";
          f.style.left = Math.random() * 100 + "vw";
          f.style.opacity = 0.4 + Math.random() * 0.5;
          f.style.animationDuration = 8 + Math.random() * 9 + "s";
          f.style.animationDelay = -Math.random() * 16 + "s";
          f.style.setProperty("--dx", Math.random() * 16 - 8 + "vw");
          sky.appendChild(f);
        }
      })();

      /* ===== mute state (shared with the other pages) ===== */
      var muted = false;
      try {
        muted = localStorage.getItem("christmasMuted") === "1";
      } catch (e) {}
      var muteBtn = document.getElementById("mute");
      function showMute() {
        muteBtn.textContent = muted ? "🔇" : "🔊";
        muteBtn.classList.toggle("off", muted);
        muteBtn.setAttribute(
          "aria-label",
          muted ? "Unmute music" : "Mute music",
        );
      }
      showMute();

      /* ===== music: a jaunty "North Pole parade" march in G major (original tune) ===== */
      var ctx = null,
        master = null,
        sfxGain = null,
        timer = null,
        started = false;
      var events = [],
        evIndex = 0,
        loopStart = 0,
        beat = 60 / TEMPO_BPM,
        LOOP_BEATS = 32;
      function hz(m) {
        return 440 * Math.pow(2, (m - 69) / 12);
      }

      (function buildSong() {
        // G C D G | G C D G
        var roots = [43, 48, 50, 43, 43, 48, 50, 43];
        var chords = [
          [62, 67, 71],
          [64, 67, 72],
          [62, 66, 69],
          [62, 67, 71],
          [62, 67, 71],
          [64, 67, 72],
          [62, 66, 69],
          [62, 67, 71],
        ];
        for (var b = 0; b < 8; b++) {
          var t = b * 4;
          events.push({ t: t, m: [roots[b]], d: 0.8, v: 0.6, w: "sine" });
          events.push({ t: t + 2, m: [roots[b]], d: 0.8, v: 0.5, w: "sine" });
          events.push({
            t: t + 1,
            m: chords[b],
            d: 0.3,
            v: 0.14,
            w: "triangle",
          });
          events.push({
            t: t + 3,
            m: chords[b],
            d: 0.3,
            v: 0.14,
            w: "triangle",
          });
        }
        var mel = [
          [0, 79, 0.5],
          [0.5, 83, 0.5],
          [1, 86, 1],
          [2, 83, 0.5],
          [2.5, 79, 0.5],
          [3, 83, 1],
          [4, 84, 0.5],
          [4.5, 88, 0.5],
          [5, 84, 1],
          [6, 81, 0.5],
          [6.5, 84, 0.5],
          [7, 79, 1],
          [8, 78, 0.5],
          [8.5, 81, 0.5],
          [9, 86, 1],
          [10, 81, 0.5],
          [10.5, 78, 0.5],
          [11, 81, 1],
          [12, 79, 1],
          [13, 83, 1],
          [14, 86, 2],
          [16, 86, 0.5],
          [16.5, 83, 0.5],
          [17, 79, 1],
          [18, 83, 0.5],
          [18.5, 86, 0.5],
          [19, 88, 1],
          [20, 88, 0.5],
          [20.5, 84, 0.5],
          [21, 79, 1],
          [22, 84, 0.5],
          [22.5, 88, 0.5],
          [23, 91, 1],
          [24, 90, 1],
          [25, 86, 1],
          [26, 81, 1],
          [27, 78, 1],
          [28, 83, 1],
          [29, 81, 1],
          [30, 79, 2],
        ];
        mel.forEach(function (n) {
          events.push({
            t: n[0],
            m: [n[1]],
            d: n[2] * 0.9,
            v: 0.4,
            w: "triangle",
            pluck: true,
            bell: true,
          });
        });
        events.sort(function (a, b) {
          return a.t - b.t;
        });
      })();

      function playNote(freq, when, durBeats, vol, wave, pluck, bell) {
        var dur = durBeats * beat;
        var o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = wave;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(vol, when + 0.012);
        g.gain.exponentialRampToValueAtTime(
          0.0001,
          when + dur + (pluck ? 0.18 : 0.25),
        );
        o.connect(g);
        g.connect(master);
        o.start(when);
        o.stop(when + dur + 0.4);
        if (bell) {
          var o2 = ctx.createOscillator(),
            g2 = ctx.createGain();
          o2.type = "sine";
          o2.frequency.value = freq * 2;
          g2.gain.setValueAtTime(0.0001, when);
          g2.gain.linearRampToValueAtTime(vol * 0.25, when + 0.01);
          g2.gain.exponentialRampToValueAtTime(0.0001, when + dur * 0.6 + 0.2);
          o2.connect(g2);
          g2.connect(master);
          o2.start(when);
          o2.stop(when + dur + 0.3);
        }
      }
      function schedule() {
        if (!ctx) return;
        while (true) {
          var e = events[evIndex];
          var when = loopStart + e.t * beat;
          if (when > ctx.currentTime + 0.5) break;
          if (when >= ctx.currentTime - 0.05) {
            for (var i = 0; i < e.m.length; i++)
              playNote(hz(e.m[i]), when, e.d, e.v, e.w, e.pluck, e.bell);
          }
          evIndex++;
          if (evIndex >= events.length) {
            evIndex = 0;
            loopStart += LOOP_BEATS * beat;
          }
        }
      }
      function startMusic() {
        if (started) {
          if (ctx && ctx.state === "suspended") ctx.resume();
          return;
        }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : MUSIC_VOLUME;
        master.connect(ctx.destination);
        sfxGain = ctx.createGain();
        sfxGain.gain.value = muted ? 0 : SFX_VOLUME;
        sfxGain.connect(ctx.destination);
        loopStart = ctx.currentTime + 0.2;
        evIndex = 0;
        timer = setInterval(schedule, 100);
        started = true;
        if (ctx.state === "suspended") ctx.resume();
      }
      /* music starts on the first tap (browsers need a tap) */
      function firstTap() {
        document.removeEventListener("click", firstTap, true);
        document.removeEventListener("touchend", firstTap, true);
        if (!muted) startMusic();
      }
      document.addEventListener("click", firstTap, true);
      document.addEventListener("touchend", firstTap, true);

      muteBtn.addEventListener("click", function () {
        muted = !muted;
        try {
          localStorage.setItem("christmasMuted", muted ? "1" : "0");
        } catch (e) {}
        showMute();
        if (!muted && !started) startMusic();
        if (ctx) {
          master.gain.setTargetAtTime(
            muted ? 0 : MUSIC_VOLUME,
            ctx.currentTime,
            0.05,
          );
          sfxGain.gain.setTargetAtTime(
            muted ? 0 : SFX_VOLUME,
            ctx.currentTime,
            0.05,
          );
        }
      });
      document.addEventListener("visibilitychange", function () {
        if (!ctx) return;
        if (document.hidden) ctx.suspend();
        else ctx.resume();
      });

      /* small bell "ding" when a worksheet button is tapped */
      function pop() {
        if (!ctx || muted) return;
        var t = ctx.currentTime;
        [1047, 1568].forEach(function (f, i) {
          var o = ctx.createOscillator(),
            g = ctx.createGain();
          o.type = "triangle";
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t + i * 0.08);
          g.gain.linearRampToValueAtTime(1, t + i * 0.08 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.08 + 0.3);
          o.connect(g);
          g.connect(sfxGain);
          o.start(t + i * 0.08);
          o.stop(t + i * 0.08 + 0.35);
        });
      }
      Array.prototype.forEach.call(
        document.querySelectorAll("a.card"),
        function (a) {
          a.addEventListener("click", pop);
        },
      );

      document.getElementById("back").addEventListener("click", function () {
        location.href = "index.html";
      });
      /* ===== audio keep-alive ===== */
      try {
        if (navigator.audioSession) navigator.audioSession.type = "playback";
      } catch (e) {}
      function wakeAudio() {
        if (ctx && !muted && !document.hidden && ctx.state !== "running") {
          var p = ctx.resume();
          if (p && p.catch) p.catch(function () {});
        }
      }
      setInterval(wakeAudio, 1000);
      ["touchend", "click"].forEach(function (ev) {
        document.addEventListener(ev, wakeAudio, true);
      });
    </script>
  </body>
</html>
